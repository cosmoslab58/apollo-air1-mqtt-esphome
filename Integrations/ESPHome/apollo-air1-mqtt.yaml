# Apollo AIR-1 — MQTT-only firmware (no Home Assistant)
#
# Forked from the official ApolloAutomation/AIR-1 ESPHome config:
#   https://github.com/ApolloAutomation/AIR-1/blob/main/Integrations/ESPHome/Core.yaml
# (ESP32-C3, i2c pins, sensor platforms, deep-sleep timing, and RGB status logic
# are taken directly from that source.)
#
# Changes from upstream:
#   - `api:` (Home Assistant native API) removed entirely, replaced with `mqtt:`.
#   - The "OTA Mode" binary_sensor (which mirrored a Home Assistant input_boolean
#     over the API) is gone. Its job — keep the device awake instead of deep-sleeping
#     — is now done by the existing `prevent_sleep` switch alone, which you can
#     trigger via a long (3s) button press or by publishing to its MQTT command
#     topic. See apollo-air1-mqtt-README.md for the OTA procedure.
#   - `reportAllValues` now also publishes one combined JSON snapshot to
#     `${mqtt_topic}/state`, so a timeseries consumer can ingest a single message
#     per wake cycle instead of joining ~20 separate per-entity topics.
#   - `statusCheck` (the boot LED color) now reflects MQTT broker connectivity
#     instead of Home Assistant API connectivity.
#   - The MICS-4514 gas sensor (NO2/CO/H2/ethanol/methane/ammonia) is removed,
#     because the unit this was written for does not have that optional add-on
#     and the component would only fail its I2C init and publish null gas
#     fields. The CO2 add-on (SCD40) is kept. If your unit HAS the MICS-4514,
#     copy the `mics_4514:` block back in from upstream `Core.yaml`.
#   - Continuous-mode data: an `interval:` re-publishes the combined
#     `${mqtt_topic}/state` snapshot whenever `prevent_sleep` is on (the
#     default). On USB power the device stays awake and streams points; on
#     battery (prevent_sleep off) it reverts to one publish per deep-sleep wake.
#     See apollo-air1-mqtt-README.md.
#   - Adaptive publish cadence: that interval is not a flat 60s. While the worst
#     severity band across PM AQI, CO2, VOC and NOx is at `publish_elevated_band`
#     or above it publishes every `publish_period_elevated_s` instead of
#     `publish_period_s`, and a band CHANGE publishes within a second at either
#     rate — so a dashboard refreshed just after the LED changes colour shows the
#     reading that caused it. Driven by air_band_worst, deliberately not by the
#     LED, so turning the LED down or off does not slow the data down.
#   - One band table, exported. The `band_cuts_*` globals are the only definition
#     of severity in the system: they grade the readings, set the cadence, and
#     pick the LED colour. `publish_band_config` publishes them to
#     `${mqtt_topic}/config/bands` (retained) so the dashboard colours its UI
#     from the device's numbers instead of its own — the two had genuinely
#     drifted (CO2 banded at 1000/1500/2000 in the app vs 800/1100/2000/3500/5000
#     here, so 900ppm showed green on screen while the LED was yellow).
#     `air_band` is also in every /state snapshot, recording the band the device
#     actually graded that reading at.
#   - Air danger alarm: the RGB LED strobes through colors while CO2, AQI or
#     VOC is at a genuinely harmful level. Each channel has its own threshold
#     substitution below, and setting one to 0 switches that channel off — VOC
#     ships off. The strobe always runs at 100% and ignores the LED Brightness
#     slider — the slider governs only the steady color, so LED Brightness 0
#     with the alarm armed is a quiet LED that lights for an emergency and
#     nothing else, and any other value adds upstream's continuous air-quality
#     indicator underneath the same alarm. See the README.
#   - Combined air-quality LED: the "Air Quality LED Source" select gains an
#     "All" option (the new default), which colours the LED by the WORST band
#     across PM AQI, CO2, VOC and NOx instead of one chosen metric. The
#     LED repaints on every sensor reading rather than once per publish.
#   - Day/night LED dimming: a second brightness setpoint, "LED Night
#     Brightness", takes over once the sun is down, easing between the two
#     across twilight rather than switching. Needs a clock, so this fork also
#     adds `time:` (SNTP) and `sun:` — the only outbound connection this
#     firmware makes besides the broker. The device does the ramp itself: a
#     dimming schedule pushed from outside would have to overwrite the
#     brightness setpoint to apply, which is the one place the user's own
#     preference is stored. See the day/night substitutions below.
#   - Ambience effects: two decorative modulations of the steady colour --
#     "Breathing" (asymmetric, slightly irregular, with occasional sighs) and
#     "Steampunk" (a slow quasi-periodic furnace glow). Both are
#     `addressable_lambda` effects, so they write the LED buffer directly and
#     add no MQTT traffic at all; both scale the colour the band painter
#     already set, so neither needs any knowledge of the bands, the day/night
#     ramp or the brightness. They stand down above `ambience_max_band` and
#     while the danger alarm is up, so decoration never softens a warning.
#   - MQTT-triggered pull OTA: publish a firmware URL to `${mqtt_topic}/command/ota`
#     and the device downloads + installs it itself. Push OTA (`esphome run`)
#     needs the device's address, which is `apollo-air-1-<mac>.local` thanks to
#     name_add_mac_suffix and is not something you necessarily have when the unit
#     is deployed; the broker is always reachable because the device dials out to
#     it. See "Updating (OTA)" in the README.
#
# Everything site-specific (broker host, credentials, CA certificate, firmware
# publish location) lives in secrets.yaml — see apollo-air1-mqtt.secrets.yaml.example.
# The only things to change here are the substitutions immediately below.

substitutions:
  name: apollo-air-1
  friendly_name: "Apollo AIR-1"
  version: "1.3.6-mqtt"
  # Root of this device's MQTT topic tree. Everything else is derived from it:
  #   ${mqtt_topic}/state              combined JSON snapshot (the data path)
  #   ${mqtt_topic}/status             online/offline (birth + LWT)
  #   ${mqtt_topic}/command/ota        pull-OTA trigger
  #   ${mqtt_topic}/<domain>/<id>/...  ESPHome's per-entity state/command topics
  mqtt_topic: esphome/apollo-air-1
  # 8883 = TLS (requires mqtt_ca_cert in secrets.yaml). For a plaintext broker,
  # set this to 1883 AND comment out the `certificate_authority:` line below.
  mqtt_port: "8883"

  # --- Publish cadence (continuous / USB mode only) --------------------------
  # How often the combined ${mqtt_topic}/state snapshot goes out while
  # prevent_sleep is on. Two rates, because a dashboard is only worth keeping
  # fresh when something is actually moving:
  #
  #   publish_period_s           below publish_elevated_band, or nothing read yet
  #   publish_period_elevated_s  worst band >= publish_elevated_band (1 = above green)
  #
  # publish_elevated_band is 1 -- "anything above green" -- and that is only
  # honest because band 0 now means what it says. It is worth understanding why
  # this setting exists at all, because it is coupled to the VOC table.
  #
  # With the VOC first cut at the 80 this config inherited from upstream, band
  # >= 1 was true 50.5% of the time on real data, and 94% of that was VOC idling
  # at its own baseline -- a permanent 2.5x rise in recording rate signalling
  # nothing. The fix at the time was to raise this threshold to 2, which worked
  # but treated the symptom. Retuning band_cuts_voc to start at 150 fixed the
  # cause, and band >= 1 is now true 5.3% of the time (1.16x the points/day of a
  # flat 60s), so the plain reading of "above green" is usable again.
  #
  # If you retune band_cuts_voc back down, revisit this number too -- measure the
  # fraction of time spent above the threshold before trusting it.
  #
  # The band-CHANGE publish below is independent of this: crossing ANY boundary
  # publishes within a second, so you never miss the moment the LED changes
  # colour even if the threshold is set high. This governs only whether the fast
  # STEADY rate is held afterwards.
  #
  # "Worst band" is the same 0-5 severity used to colour the LED, taken across
  # PM AQI, CO2, VOC and NOx -- but read from air_band_worst, NOT from the LED.
  # The two are deliberately decoupled: LED Brightness 0 or Air Quality LED
  # Source "Off" means a dark LED, not stale data.
  #
  # A band CHANGE also publishes immediately at either rate, so the first
  # snapshot showing the new colour lands within a second of the LED changing
  # instead of up to a full period later. That is the case someone refreshing
  # the page is usually trying to catch.
  #
  # Set the two equal for one fixed rate (upstream's behaviour).
  #
  # DON'T GO FASTER THAN THE SENSORS. The useful floor is ~5s, set by the SCD40:
  # in periodic mode it produces a new measurement every ~5s internally, and the
  # SEN55 every ~1s. (Those are the real limits, not the 10s `update_interval`s
  # in this file -- reportAllValues force-updates every component before it
  # serialises, so a publish always triggers a fresh read regardless of the
  # configured polling interval.) Below ~5s consecutive snapshots would start
  # repeating the same CO2 reading: more rows in InfluxDB, no more information.
  # 15s is ~3x that floor, so every elevated publish carries genuinely new data
  # on every channel.
  #
  # The 1s tick of the interval below is a hard floor too, but it is scheduler
  # granularity and reads no sensors -- see the comment there.
  #
  # None of this applies in battery/deep-sleep mode (prevent_sleep off): the
  # device is asleep for most of the cycle and publishes once per wake. See
  # "Publish cadence" in the README.
  publish_period_s: "60"
  publish_period_elevated_s: "15"
  publish_elevated_band: "1"

  # --- Air danger alarm ------------------------------------------------------
  # Thresholds at which the RGB LED strobes through colors as a get-out-of-the-
  # room signal. These are deliberately set at genuinely HARMFUL levels, not
  # merely "poor air" ones -- an alarm that cries wolf at a stuffy 1200ppm gets
  # ignored when it matters. Node-RED already sends a Gotify nudge at the softer
  # 1000ppm / AQI 100 marks; this is the tier above that.
  #
  #   co2   5000 ppm : the ACGIH TLV / OSHA PEL 8-hour occupational limit.
  #                    1000-2000 is stuffy and measurably hurts concentration,
  #                    but is not itself dangerous.
  #   aqi   200      : EPA "Very Unhealthy" -- health alert, everyone may
  #                    experience serious effects. Derived from PM2.5 + PM10,
  #                    so particulates are already covered by this one number.
  #   voc   0        : DISABLED. Set to 400 for the top band of the VOC Quality
  #                    text sensor ("Extremely abnormal"), or any 1-500 value.
  #
  # Any threshold set to 0 is off -- the clause is a compile-time constant, so a
  # disabled channel costs nothing at runtime and the sensor is still measured
  # and published either way. Only the LED trigger goes away.
  #
  # VOC ships disabled here, which is a judgement about placement rather than
  # about the sensor. The VOC Index is RELATIVE to a ~72h learned baseline rather
  # than an absolute concentration, so it answers "is this different from recent
  # normal?", not "is this harmful?" -- ordinary domestic events (cleaning spray,
  # deodorant, a freshly opened package off-gassing) reach the top band with
  # nothing actually wrong. In the bedroom this unit sits in, that is a light
  # strobing at you overnight, and a nuisance alarm is one you stop reading.
  # In a workshop, garage, or lab -- somewhere solvent vapour is a real hazard
  # and a spike genuinely means something -- set this to 400 and it works as
  # before. CO2 and AQI stay on because both are absolute, calibrated limits.
  danger_co2_ppm: "5000"
  danger_aqi: "200"
  danger_voc_index: "0"

  # --- Day/night LED dimming -------------------------------------------------
  # The steady LED runs at "LED Brightness" while the sun is up and at "LED
  # Night Brightness" once it is down, easing between the two across twilight.
  # See the sun_dim_evaluate script for the mechanism.
  #
  # The ramp is driven by the sun's ELEVATION rather than by a clock offset
  # ("30 min before sunset"), because elevation is self-adjusting: the same two
  # numbers give a longer twilight in December than in June, exactly as the sky
  # does, and the maths needs no timezone at all (elevation is computed in UTC,
  # which is why there is no timezone: key on the time component below).
  #
  #   sun_fade_high_deg  at or above this elevation it is fully DAY
  #   sun_fade_low_deg   at or below this elevation it is fully NIGHT
  #
  # -6 is civil dusk -- the conventional "it is now dark" mark, when the horizon
  # is no longer distinguishable. +3 rather than 0 because the last few degrees
  # above the horizon are already dim enough indoors to want the night level.
  # At 42.6N that spans roughly 35-50 min depending on season.
  #
  # Widen the pair for a longer, gentler ramp; set them equal-ish for an abrupt
  # switch at that elevation. Reversed or equal values would divide by zero, so
  # sun_dim_evaluate falls back to a hard cut if high <= low.
  sun_fade_high_deg: "3.0"
  sun_fade_low_deg: "-6.0"

  # Fallback location for the sun calculation, used ONLY until the dashboard's
  # retained home-config message arrives (see the config/home subscription in
  # the mqtt block). Matches home_config.py's default home in the dashboard app,
  # so an un-configured pair of components still agree with each other.
  home_latitude: "42.5988"
  home_longitude: "-83.3577"

  # How often the day/night ramp is recomputed. Not the sensor cadence and not a
  # publish rate: it only re-derives one float and repaints the LED if the
  # effective brightness moved by a whole percent. Across a ~40 min twilight
  # that is at most ~90 repaints, and outside twilight it is silent.
  sun_dim_interval: "30s"

  # Where the clock comes from. Any NTP host: a LAN router or local time server
  # is preferable if outbound UDP/123 is filtered on this VLAN. pool.ntp.org is
  # kept as the second entry either way, so a dead LAN server still resolves.
  ntp_server: "pool.ntp.org"

  # --- Ambience effects ------------------------------------------------------
  # Two decorative brightness effects -- "Breathing" and "Steampunk" -- that
  # modulate the steady band colour without changing what it means. Selected by
  # the "LED Ambience" select; depth set by "LED Ambience Intensity".
  #
  # ambience_depth_max is the modulation depth at intensity 100, as a fraction
  # of the current brightness. 0.35 means the light swings across 35% of its
  # level -- roughly +/-17.5% either side of the setpoint, which reads as
  # movement without reading as a fault. Raise it for something theatrical.
  #
  # ambience_max_band is the WORST severity band at which ambience still runs.
  # 1 = green and yellow only; from orange (2) up the light goes back to a
  # steady colour. A warning that is also gently pulsing reads as less urgent
  # than one that is not, and this device's whole premise is that the light on
  # the wall means something. Set to 5 to keep the effect running at every
  # band, or 0 to restrict it to green.
  ambience_depth_max: "0.35"
  ambience_max_band: "1"

  # Breathing cadence, milliseconds per cycle. A fresh value is drawn from this
  # range every breath, so the spread is also how irregular it is.
  #
  # 6800-8800 is 6.8-8.8 breaths/min: slower than a real sleeping adult, who
  # runs 10-16, and deliberately so. A light is not a chest -- the same cadence
  # that looks restful on a sleeping person reads as brisk on an LED, and the
  # first version at 11-14/min was asked to slow down. This is about where deep
  # relaxation and meditative breathing sit.
  #
  # Do not go much below ~5 breaths/min (12000ms): past that it stops reading as
  # breathing and starts reading as a slow fade. And note that slowing the
  # breath works AGAINST smoothness -- the number of brightness levels is fixed
  # by the hardware, so a longer cycle holds each one for longer. If a slower
  # setting looks steppy, raise the brightness or the intensity rather than
  # reaching for a shorter period.
  breath_period_min_ms: "6800"
  breath_period_max_ms: "8800"

  # Frame interval for both effects. Costs almost nothing regardless: three
  # LEDs, a handful of floats, and no MQTT traffic at all -- addressable effects
  # write the LED buffer directly rather than issuing a LightCall, which is the
  # whole reason these are effects and not a script driving light.turn_on in a
  # loop. That version would publish the light's MQTT state on every frame.
  #
  # 5ms rather than the 20ms the waveforms need, because the temporal half of
  # the dithering spends frames as its currency: it alternates between adjacent
  # output levels, and that alternation has to sit above the band the eye reads
  # as flicker. A WS2812 write for three LEDs is ~90us, so 200fps is under 2%
  # of the wire. This is a request, not a guarantee -- effects run from the main
  # loop, which WiFi and MQTT can stall -- so ambience_dither.h reports the rate
  # it actually achieves (`[ambience]` in the logs).
  ambience_frame_ms: "5ms"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # Sub-LSB brightness synthesis for the two ambience effects. A header rather
  # than a third copy of the same 40 lines inside each effect lambda -- the two
  # effects differ only in their waveform, and the part that turns a float into
  # light is identical and fiddly enough that two copies would drift.
  includes:
    - ambience_dither.h
  comment: "Apollo AIR-1 (MQTT firmware, CO2 add-on installed)"
  name_add_mac_suffix: true
  project:
    name: "custom.apollo-air-1-mqtt"
    version: "${version}"
  min_version: 2025.2.0
  on_boot:
    priority: 500
    then:
      - text_sensor.template.publish:
          id: apollo_firmware_version
          state: "${version}"
      - lambda: |-
          id(deep_sleep_1).set_sleep_duration(id(deep_sleep_sleep_duration).state * 60 * 1000);
      # The day/night migration that used to sit here has been REMOVED, and the
      # reason is worth keeping. It seeded night from day on a device that had
      # no stored night value, because the alternative then was a fixed
      # initial_value of 100 -- which on a unit dimmed to 41% would have made
      # the LED brighter at night on the very update that added night dimming.
      #
      # The night default is now a deliberate 21%, measured in the room rather
      # than picked as a round number, so seeding from day would override a
      # considered default with an unrelated one. The failure it guarded against
      # cannot happen either: a default BELOW the day value cannot brighten
      # anything, and if someone's day sits under 21 the clamp pulls night down
      # to meet it. The guard outlived its hazard.
      - lambda: |-
          ESP_LOGI("led", "restored brightness: day %.0f%%, night %.0f%%",
                   id(air_quality_led_brightness).state,
                   id(air_quality_led_night_brightness).state);
      - if:
          condition:
            switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing deep sleep: prevent_sleep switch is on");
                id(deep_sleep_1).prevent_deep_sleep();
  on_shutdown:
    - light.turn_off: rgb_light

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

# Firmware downloads for the pull-OTA path below. The 4.5s default timeout is far
# too short for a ~1.1MB image, and the download must not trip the watchdog.
# verify_ssl uses esp-idf's built-in Mozilla root CA bundle, so https:// to a
# Let's Encrypt host validates with no cert config of your own. Plain http:// URLs
# work too, and redirects are followed.
http_request:
  verify_ssl: true
  timeout: 60s
  buffer_size_rx: 2048
  watchdog_timeout: 120s

ota:
  # Push OTA — kept as the bench/recovery path (`esphome run`), needs the address.
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
  # Pull OTA — driven by the ${mqtt_topic}/command/ota trigger in the mqtt block.
  - platform: http_request
    id: ota_http

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Apollo AIR1 Hotspot"

captive_portal:

# Clock and sun position. Both exist for exactly one feature -- the day/night
# LED ramp -- and nothing else in this config reads the time.
#
# No `timezone:` on purpose. Sun elevation is a function of UTC and the
# coordinates, so the ramp is correct with no timezone set at all, and one more
# piece of per-site config that could be wrong is one fewer thing to be wrong.
# (Set it if you later want local wall-clock times in the logs.)
#
# If NTP never syncs, the sun component still answers -- with garbage computed
# from the 1970 epoch. sun_dim_evaluate therefore checks the clock is valid
# before it dims, and holds the daytime brightness if it is not: a wrong clock
# should never be able to leave the indicator dark. Confirm a real sync after
# flashing with `just logs` (the sntp component logs "Synchronized time").
time:
  - platform: sntp
    id: sntp_time
    servers:
      - ${ntp_server}
      - pool.ntp.org
      - time.nist.gov

# Coordinates are the compile-time fallback only; the retained config/home
# message from the dashboard overrides them at runtime (see the mqtt block), so
# the home location lives in one place -- the dashboard -- rather than being
# baked into each consumer separately.
sun:
  id: air1_sun
  time_id: sntp_time
  latitude: ${home_latitude}°
  longitude: ${home_longitude}°

web_server:
  port: 80
  version: 3

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: ${mqtt_port}
  username: !secret mqtt_username
  password: !secret mqtt_password
  # TLS. The CA that signed your broker's certificate, as a PEM block in
  # secrets.yaml (see the example file for how to obtain it). ESPHome's mqtt
  # component needs an explicit CA -- unlike http_request above, it cannot use
  # esp-idf's bundled root store. For a PLAINTEXT broker, comment this line out
  # and set the mqtt_port substitution to 1883.
  certificate_authority: !secret mqtt_ca_cert
  topic_prefix: ${mqtt_topic}
  discovery: false
  # Pull-OTA trigger. Publish (NOT retained -- see below):
  #   {"command":"ota","url":"https://host/path/firmware.ota.bin","version":"1.2.0"}
  # to ${mqtt_topic}/command/ota. The device fetches the image itself, so the
  # publisher never needs the device's IP or hostname -- only the broker.
  #
  # NEVER publish this retained: the broker would replay it on every reconnect,
  # and the device reconnects immediately after an OTA reboot -- an endless
  # reflash loop. The version guard below is the backstop if that ever happens
  # by accident, and also makes re-sending the same command a no-op.
  on_json_message:
    - topic: ${mqtt_topic}/command/ota
      qos: 1
      then:
        - if:
            condition:
              lambda: |-
                std::string url(x["url"] | "");
                std::string ver(x["version"] | "");
                if (url.empty()) {
                  ESP_LOGE("ota", "OTA command has no 'url' field - ignoring");
                  return false;
                }
                if (ver == "${version}") {
                  ESP_LOGI("ota", "OTA command for %s, already running it - skipping", ver.c_str());
                  return false;
                }
                ESP_LOGW("ota", "OTA command: %s -> %s (running ${version})", ver.c_str(), url.c_str());
                return true;
            then:
              - ota.http_request.flash:
                  url: !lambda 'return std::string(x["url"] | "");'
                  md5_url: !lambda 'return std::string(x["url"] | "") + ".md5";'
    # Home location, for the sun calculation behind the day/night LED ramp.
    # Published RETAINED by the dashboard app (home_config.py) as
    #   {"zip":..., "lat":..., "lon":..., "location_slug":..., "purpleair_sensor":...}
    # and consumed by Node-RED too, so the location is configured once, in the
    # app, and every consumer follows. Retained means this lands within a second
    # of connecting rather than waiting for the next time someone saves a home.
    #
    # Unlike the OTA topic above, retention is exactly what this wants: replaying
    # it on every reconnect is idempotent (it sets two doubles).
    #
    # Only the fields this device needs are read; the rest are Node-RED's. A
    # missing or nonsensical payload leaves the compile-time fallback in place --
    # 0,0 is in the Gulf of Guinea, so it must be rejected rather than trusted.
    - topic: ${mqtt_topic}/config/home
      qos: 1
      then:
        - lambda: |-
            const double lat = x["lat"] | 1000.0;
            const double lon = x["lon"] | 1000.0;
            if (lat < -90.0 || lat > 90.0 || lon < -180.0 || lon > 180.0 ||
                (lat == 0.0 && lon == 0.0)) {
              ESP_LOGW("sun", "config/home has no usable lat/lon - keeping ${home_latitude}, ${home_longitude}");
              return;
            }
            id(air1_sun).set_latitude(lat);
            id(air1_sun).set_longitude(lon);
            ESP_LOGI("sun", "home location set to %.4f, %.4f", lat, lon);
        # Re-derive the ramp against the new coordinates rather than waiting up
        # to ${sun_dim_interval} for the next tick. Cheap and idempotent, so it
        # runs even when the payload was rejected above.
        - script.execute: sun_dim_evaluate
  on_connect:
    - delay: 20s
    # Retained, so this only has to succeed once per connect to keep every
    # consumer's colours in step with the LED -- including consumers that are
    # not running right now. Before the first snapshot, so a dashboard that
    # subscribes and immediately gets a reading already has the table to colour
    # it with.
    - script.execute: publish_band_config
    - lambda: |-
        id(reportAllValues).execute();
    - delay: 3s
    - if:
        condition:
          switch.is_off: prevent_sleep
        then:
          - deep_sleep.enter:
              id: deep_sleep_1

globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  - id: runTest
    restore_value: yes
    type: bool
    initial_value: "true"
  - id: testCycleCount
    type: int
    restore_value: no
    initial_value: "0"
  - id: dps310Passed
    restore_value: no
    type: bool
    initial_value: "false"
  # Latches whether the air-danger alarm is currently showing, so airDangerCheck
  # only acts on transitions. Without it, every evaluation would re-issue
  # turn_on and restart the strobe from its first color -- and since the check
  # now runs on every sensor reading rather than once per publish, the alarm
  # would stutter several times a minute rather than once. Not restored:
  # the alarm state should be re-derived from live readings on boot, never
  # replayed from flash.
  - id: air_danger_active
    restore_value: no
    type: bool
    initial_value: "false"
  # Last steady-colour state actually pushed to the LED, so update_air_quality_led
  # can skip a redundant repaint. It now runs on every air-quality reading
  # (~4 sensors x 10s) and LightCall::perform() publishes the light's MQTT state
  # topic on every call whether or not anything changed -- without this the
  # broker would carry ~24 identical rgb_light/state messages a minute.
  # -2 is the "unknown, repaint unconditionally" sentinel; -1 means "off".
  - id: led_last_band
    restore_value: no
    type: int
    initial_value: "-2"
  - id: led_last_level
    restore_value: no
    type: float
    initial_value: "-1.0f"

  # The day/night ramp, 0.0 = fully night ... 1.0 = fully day. Recomputed from
  # the sun's elevation every ${sun_dim_interval} by sun_dim_evaluate, and read
  # by update_air_quality_led to interpolate between the two brightness
  # setpoints. Deliberately NOT restored: it is a pure function of the clock and
  # the coordinates, so it must be re-derived on boot, never replayed from
  # flash -- a device that rebooted at dusk and restored a stale 1.0 would sit
  # at daytime brightness until the next tick.
  #
  # Starts at 1.0 (day). Every fallback in this feature is "hold the daytime
  # brightness": before the first NTP sync, on a device that cannot reach NTP at
  # all, and in the first seconds after boot. Failing bright is the safe
  # direction -- failing dark would look exactly like a broken indicator.
  - id: sun_day_factor
    restore_value: no
    type: float
    initial_value: "1.0f"

  # Last effective brightness percent actually handed to update_air_quality_led,
  # quantised to whole percent. The ramp is recomputed far more often than it
  # meaningfully moves, and every repaint is an MQTT light-state publish, so
  # this is what keeps a device outside twilight completely silent. -1 = unknown.
  - id: led_dim_last_pct
    restore_value: no
    type: int
    initial_value: "-1"

  - id: led_ambience_active
    restore_value: no
    type: bool
    initial_value: "false"

  # ===========================================================================
  # THE BAND TABLES. This is the single source of truth for "how bad is it" on
  # this device, and there is deliberately no second copy anywhere -- not in
  # another lambda, not in the dashboard, not in Node-RED. compute_air_bands
  # grades readings against these, and publish_band_config publishes the very
  # same arrays to ${mqtt_topic}/config/bands (retained) so consumers colour
  # their UI from the device's numbers instead of their own. A dashboard showing
  # green while the LED is yellow is the failure mode this exists to prevent.
  #
  # Convention, uniform across all four: band i is the first i where
  # `value <= cuts[i]`, else the last band. Upper bound INCLUSIVE, matching
  # EPA's own breakpoint style (0-50 Good, 51-100 Moderate). VOC and NOx used
  # exclusive `<` before this was unified, so their boundaries have shifted by
  # one index unit -- VOC exactly 150 is now band 1 rather than band 2. That is
  # immaterial on a 1-500 relative index and buys an unambiguous shared
  # contract; the alternative was publishing 79/149/249/399 to preserve the old
  # edges exactly, which nobody reading the JSON would understand.
  #
  # Array length sets the number of bands: 5 cuts -> bands 0-5, 4 cuts ->
  # bands 0-4. That is how VOC and NOx cap at 4 without a special case (see
  # their comments below for why they must never reach 5).
  #
  # US EPA AQI. The one genuinely regulated scale here.
  - id: band_cuts_aqi
    restore_value: no
    type: int[5]
    initial_value: "{50, 100, 150, 200, 300}"
  # ppm, SCD40. Retuned away from upstream's 800/1000/1500/2000/2500, which
  # paired its top band with the name "Hazardous" at 2500ppm -- an ordinary
  # closed bedroom overnight.
  #
  # There is NO official government severity scale for indoor CO2. EPA does not
  # regulate it (not a criteria pollutant), and the WHO indoor air quality
  # guidelines do not cover it. Only three points are anchored at all:
  #
  #   800   CDC ventilation guidance for shared indoor spaces. A
  #         ventilation-adequacy proxy, NOT a health threshold.
  #   1100  ASHRAE comfort/odour range (~700ppm above outdoor ambient). Also a
  #         professional-society figure, not a regulation.
  #   5000  OSHA PEL (29 CFR 1910.1000) and NIOSH REL, 8h TWA. The one
  #         enforceable number in the whole scale.
  #
  # 2000 and 3500 are interpolation between those, and are labelled in the
  # README as judgement calls rather than guidance. The top band coincides with
  # the danger_co2_ppm strobe threshold instead of sitting at half of it, so
  # "worst steady colour" means "you are at the level that trips the alarm"
  # rather than contradicting it.
  #
  # Caveat no threshold can fix: the PEL is an 8h occupational limit for healthy
  # adult workers. This unit is in a bedroom.
  - id: band_cuts_co2
    restore_value: no
    type: int[5]
    initial_value: "{800, 1100, 2000, 3500, 5000}"
  # The two Sensirion gas indices run 1-500 and are RELATIVE to a learned
  # baseline, so they answer "different from recent normal?" rather than
  # "harmful?". Their top rung is "extremely abnormal", which is not a severity
  # claim at all -- hence only 4 cuts, so neither can ever drive the LED to
  # band 5 on its own.
  #
  # The first cut is 150, NOT the 80 inherited from upstream, and this is the
  # one number here chosen from measurement rather than from a guideline.
  #
  # algorithm_tuning sets index_offset 100, which means the algorithm reports
  # ~100 when conditions match its own learned baseline. A first cut of 80 put
  # the sensor's definition of "nothing unusual" in band 1 -- band 0 meant
  # "quieter than typical", a state a self-baselining index visits about half
  # the time and never stays in. Measured over 2.5 days of this unit's data:
  # band 0 only 50% of the time, the 80 line crossed ~27x/day with nothing
  # happening, and the LED yellow half its life by construction.
  #
  # 150 is the top of this unit's observed idle range, so band 0 now means
  # "normal or better" and covers 94.7% of samples. Real events still register
  # clearly -- brewed coffee two rooms away reached 424, i.e. band 3.
  #
  # NOx below is the control that proves the diagnosis: its offset is the
  # driver's default of 1, far below its first cut of 20, and it correctly reads
  # band 0 99% of the time with no retuning at all.
  #
  # Three cuts, so VOC tops out at band 3 (red) rather than the 4 (purple) it
  # could reach before. Same reasoning that already stopped it at 4 instead of 5,
  # applied one notch further: this is a RELATIVE deviation index, and letting it
  # claim a band whose AQI meaning is "very unhealthy" is the same category error
  # as letting it claim "hazardous". Add a fourth cut if you want that band back.
  - id: band_cuts_voc
    restore_value: no
    type: int[3]
    initial_value: "{150, 250, 400}"
  # NOx uses the driver's default index_offset of 1, which is why its first
  # boundary is so much lower than VOC's rather than a copy-paste slip.
  - id: band_cuts_nox
    restore_value: no
    type: int[4]
    initial_value: "{20, 150, 250, 400}"

  # Severity band per channel (0 = best ... 5 = worst, -1 = no usable reading),
  # plus the worst across all four. Recomputed by compute_air_bands on every
  # sensor reading and never written anywhere else.
  #
  # These were local variables inside update_air_quality_led until the publish
  # cadence needed them too. Hoisting them keeps the threshold tables in ONE
  # place, which matters because the two consumers want different slices of the
  # same answer: the LED paints whichever channel the source select names, while
  # the cadence always wants the worst-of and must be indifferent to how the LED
  # is configured. Duplicating the tables would mean retuning CO2 twice and
  # eventually having a dashboard that disagrees with the light on the wall.
  #
  # Not restored: bands are a statement about the air right now, and replaying
  # a stale one from flash would make a freshly booted device publish fast (or
  # paint a colour) on evidence that no longer exists.
  - id: air_band_aqi
    restore_value: no
    type: int
    initial_value: "-1"
  - id: air_band_co2
    restore_value: no
    type: int
    initial_value: "-1"
  - id: air_band_voc
    restore_value: no
    type: int
    initial_value: "-1"
  - id: air_band_nox
    restore_value: no
    type: int
    initial_value: "-1"
  - id: air_band_worst
    restore_value: no
    type: int
    initial_value: "-1"

  # Publish-cadence bookkeeping for the interval below. publish_last_band starts
  # at -1 to match air_band_worst's own "nothing read yet" value, so the first
  # real reading registers as a change (-1 -> whatever the air is) and gets a
  # point out promptly instead of waiting a full period behind the on_connect
  # publish. publish_last_ms is compared with unsigned arithmetic, which is
  # rollover-safe at the ~49 day millis() wrap.
  - id: publish_last_ms
    restore_value: no
    type: uint32_t
    initial_value: "0"
  - id: publish_last_band
    restore_value: no
    type: int
    initial_value: "-1"

i2c:
  sda: GPIO1
  scl: GPIO0
  id: bus_a

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 5min
  run_duration: 2min

# Continuous (USB) mode: while prevent_sleep is on, re-publish the combined
# /state snapshot so your consumer keeps getting data. The switch is only read
# here as a "running continuously?" flag -- it does NOT re-prevent sleep (that
# latches once when the switch turns on). In battery/duty-cycle mode
# (prevent_sleep off) this stays quiet and the on_connect publish + deep sleep
# handles the one-point-per-wake cadence.
#
# The rate is adaptive rather than a flat 60s -- see the publish_period_*
# substitutions at the top for the rationale and the knobs. The 1s tick is
# scheduler granularity, not the publish rate: the lambda decides whether
# anything is actually due, and on a green, steady device it declines 59 times
# out of 60. Setting the tick to the slow rate instead would quantise
# everything to it, so a band change could sit unpublished for up to a minute --
# precisely the wait this exists to remove.
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(prevent_sleep).state) {
            return;
          }

          // During an event, publish faster: someone opening the dashboard
          // wants to watch it move, and a minute-old snapshot of an event in
          // progress is stale enough to mislead about the trend. See
          // publish_elevated_band at the top -- it is coupled to the VOC band
          // table, and "above green" is only a sane trigger because band 0 has
          // been retuned to actually mean normal.
          const int band = id(air_band_worst);
          const uint32_t period =
              (band >= ${publish_elevated_band} ? ${publish_period_elevated_s}
                                               : ${publish_period_s}) * 1000UL;

          // A band change jumps the queue. This cannot become a publish storm
          // even if a reading sits on a boundary and dithers across it: bands
          // only move when a sensor reports, and the fastest of those is 10s.
          const uint32_t now = millis();
          const bool changed = (band != id(publish_last_band));
          if (!changed && (now - id(publish_last_ms)) < period) {
            return;
          }

          // Stamped at dispatch rather than on completion, so each period is
          // measured from a fixed point. reportAllValues takes ~500ms (it
          // force-updates every component and waits for them before
          // serialising); charging that to the interval would make the real
          // cadence drift slower than the configured one.
          id(publish_last_ms) = now;
          id(publish_last_band) = band;
          id(reportAllValues).execute();

  # Day/night LED ramp. Unconditional -- unlike the publish tick above it is not
  # gated on prevent_sleep, because the LED is lit on a duty-cycled device too
  # (for the ~2 min of each wake it is awake) and should be dimmed then as well.
  # Cheap enough to run flat out: see sun_dim_evaluate for why this ticks far
  # faster than it acts.
  - interval: ${sun_dim_interval}
    then:
      - script.execute: sun_dim_evaluate

# Stock air-quality LED. Upstream Core.yaml drives rgb_light from ONE selected
# metric, banded into six severity colors. "All" is a local addition and the
# default: it takes the worst band across every air-quality channel the device
# has, so a spike on any one of them colours the LED. The single-metric options
# are kept because pinning the LED to one channel is genuinely useful when you
# are calibrating or debugging that channel.
#
# This is independent of the Air Danger strobe: the strobe overrides the steady
# color while the air is genuinely unsafe, and the color is restored when it
# clears. See update_air_quality_led.
select:
  - platform: template
    name: "Air Quality LED Source"
    id: air_quality_led_source
    icon: mdi:led-on
    optimistic: true
    restore_value: true
    entity_category: "config"
    # WARNING: restore_value persists the option's INDEX, not its name (see
    # template_select.cpp setup_with_restore). Inserting or reordering an option
    # therefore silently reassigns what every already-deployed unit restores to.
    # Adding "All" at index 1 shifted this list by one, so a device last set to
    # "NowCast AQI" (old index 1) came back as "All", and one set to "CO2" (old
    # index 2) came back as "NowCast AQI". Append new options at the END unless
    # you intend that remap, and check the unit after an OTA either way.
    # "NowCast AQI" was renamed to "PM AQI" IN PLACE, keeping index 2, so that
    # rename is safe for deployed units -- unlike the insertion above.
    options: ["Off", "All", "PM AQI", "CO2", "VOC Index", "NOx Index"]
    # Only applies to a factory-reset or newly flashed device; a deployed unit
    # restores its stored index instead.
    initial_option: "All"
    on_value:
      then:
        - script.execute: update_air_quality_led

  # Decorative modulation of the steady colour. Mutually exclusive by
  # construction rather than by choice: ESPHome runs at most one light effect at
  # a time, so a pair of independent on/off switches would be a control that
  # cannot represent its own state. A select says what is actually true.
  #
  # These change only HOW BRIGHT the band colour is, moment to moment -- never
  # which colour, never the band, never the publish cadence. The colour still
  # means exactly what the band table says it means.
  #
  # Same restore_value-stores-the-INDEX warning as the select above: append new
  # options at the END.
  - platform: template
    name: "LED Ambience"
    id: led_ambience
    icon: mdi:waveform
    optimistic: true
    restore_value: true
    entity_category: "config"
    options: ["Off", "Breathing", "Steampunk"]
    # The option names must match the effect names in the light: block below
    # EXACTLY -- apply_led_ambience passes this string straight to set_effect,
    # and ESPHome logs "no such effect" and leaves the light alone on a
    # mismatch. "Off" is the one value that is not an effect name; it maps to
    # ESPHome's built-in "None".
    initial_option: "Breathing"
    on_value:
      then:
        # apply_led_state, NOT apply_led_ambience directly. Selecting an effect
        # changes two things -- whether an effect runs AND the brightness
        # headroom it needs -- and only update_air_quality_led can work out the
        # second, because only it knows the band. Calling the ambience script on
        # its own leaves led_ambience_active stale until the next sensor
        # reading, which showed up as the select taking up to ~10s to act, and
        # then only sometimes. This is the same full re-derive the brightness
        # sliders use.
        - script.execute: apply_led_state

number:
  - platform: template
    name: "LED Brightness"
    id: air_quality_led_brightness
    icon: mdi:brightness-6
    optimistic: true
    restore_value: true
    entity_category: "config"
    unit_of_measurement: "%"
    # Upstream's floor is 5; 0 is allowed here so the slider doubles as the
    # master off. There is deliberately no separate enable switch -- one
    # control that can reach zero beats two that can disagree.
    #
    # STEADY COLOR ONLY, in every mode. The strobe is hardcoded to 100% and
    # ignores this control entirely -- an alarm that a stray slider drag can dim
    # to invisibility is not an alarm -- so 0 silences the indicator and never
    # the alarm. That is what makes this the only control needed for what the
    # LED does between alarms: 0 for a dark LED that only ever speaks up in an
    # emergency, anything above it for a light that reports the band constantly
    # and still strobes on top when it matters.
    min_value: 0
    max_value: 100
    step: 1
    # Measured in the room this unit lives in, not a round number: 33% is where
    # the indicator is readable across the room without being a presence.
    initial_value: 33
    mode: slider
    on_value:
      then:
        # Lowering day below night has to bring night down with it, or the pair
        # would be left in a state the ramp cannot express. See the script.
        - script.execute: clamp_night_to_day
        - script.execute: apply_led_state

  # Night half of the pair above. The two are interpolated by the sun's
  # elevation across twilight (see sun_dim_evaluate), so this is what the steady
  # colour settles to once it is properly dark, and "LED Brightness" is what it
  # settles to in daylight.
  #
  # NAMING. "LED Brightness" was not renamed to "LED Brightness Day" when this
  # was added, and the asymmetry is deliberate. ESPHome derives both the MQTT
  # object_id AND the flash preference key from the entity NAME, so renaming it
  # would have changed its topic (breaking every publisher, silently -- see the
  # warning on the select above) and orphaned its stored value, resetting a unit
  # that had been dimmed to 30% back to 100% on the OTA that introduced a
  # feature about dimming. It keeps its name and quietly becomes the daytime
  # value; the dashboard labels the pair "Day" and "Night".
  #
  # The default is deliberately BELOW the day default rather than equal to it.
  # An earlier version shipped 100 here and seeded night from day on first boot
  # to avoid making the LED brighter at night on the update that added night
  # dimming; a default under day makes that impossible by construction, and the
  # clamp handles the case where someone's day sits lower still.
  #
  # There is no separate enable switch for the same reason there is no separate
  # LED on/off switch -- night == day IS off, and 0 is a genuinely dark night.
  - platform: template
    name: "LED Night Brightness"
    id: air_quality_led_night_brightness
    icon: mdi:brightness-3
    optimistic: true
    restore_value: true
    entity_category: "config"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    # Dim enough for a bedroom, still bright enough that the ambience effects
    # have PWM steps to work with. Below ~20% they run out of resolution.
    initial_value: 21
    mode: slider
    on_value:
      then:
        # Night above day is not a configuration, it is a contradiction: the
        # ramp would brighten the LED at dusk. Enforced here rather than only in
        # the dashboard because three things can set this -- the dashboard, the
        # device's own web UI, and a raw MQTT publish -- and an invariant that
        # only one of them respects is not an invariant.
        - script.execute: clamp_night_to_day
        - script.execute: apply_led_state

  # Depth of the ambience modulation, as a percentage of ambience_depth_max.
  # Deliberately a percentage of a compile-time ceiling rather than a raw
  # percentage of brightness: the ceiling is where the judgement about "how far
  # is too far" lives, in one place, next to its reasoning.
  #
  # 0 leaves the effect selected but flat, which is a legitimate place to sit
  # while deciding -- unlike LED Brightness, 0 here is not a master off. The
  # select is the master off, because "no effect" and "an effect of no depth"
  # are genuinely different states and the LED Ambience select can say which.
  - platform: template
    name: "LED Ambience Intensity"
    id: led_ambience_intensity
    icon: mdi:sine-wave
    optimistic: true
    restore_value: true
    entity_category: "config"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 47
    mode: slider
    on_value:
      then:
        # No effect restart needed -- both effects read this live, every frame.
        # apply_led_state re-derives the brightness, which matters because the
        # headroom the effect modulates within is a function of this depth.
        - script.execute: apply_led_state

  - platform: template
    name: "SEN55 Temperature Offset"
    id: sen55_temperature_offset
    restore_value: true
    initial_value: 6.0
    min_value: -70.0
    max_value: 70.0
    entity_category: "CONFIG"
    unit_of_measurement: "°C"
    optimistic: true
    update_interval: never
    step: 0.1
    mode: box
  - platform: template
    name: "SEN55 Humidity Offset"
    id: sen55_humidity_offset
    restore_value: true
    initial_value: 0
    min_value: -70.0
    max_value: 70.0
    entity_category: "CONFIG"
    unit_of_measurement: "%"
    optimistic: true
    update_interval: never
    step: 0.1
    mode: box
  - platform: template
    name: "DPS310 Pressure Offset"
    id: dps310_pressure_offset
    disabled_by_default: true
    restore_value: true
    initial_value: 0.0
    min_value: -100.0
    max_value: 100.0
    entity_category: "CONFIG"
    unit_of_measurement: "hPa"
    optimistic: true
    update_interval: never
    step: 0.1
    mode: box
  - platform: template
    name: "Sleep Duration"
    id: deep_sleep_sleep_duration
    min_value: 0
    max_value: 800
    step: 1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 5
    icon: "mdi:arrow-collapse-right"
    entity_category: CONFIG
    unit_of_measurement: "min"
    on_value:
      then:
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(x * 60 * 1000);

binary_sensor:
  - platform: status
    name: "Device Online"
    id: device_online
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    id: reset_button
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();
    on_release:
      then:
        - lambda: |-
            if (millis() - id(button_press_timestamp) >= 10000) {
              id(prevent_sleep).turn_on();
              id(factory_reset_switch).turn_on();
            }
            else if (millis() - id(button_press_timestamp) >= 3000) {
              // Hold 3s: keep device awake (e.g. for OTA)
              id(prevent_sleep).turn_on();
              id(deep_sleep_1).prevent_deep_sleep();
            }
            else {
              id(statusCheck).execute();
              delay(3000);
              id(testCycleCount) = 0;
              id(runTest) = true;
              id(testScript).execute();
            }

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature

  - platform: uptime
    name: "Uptime"
    id: sys_uptime
    update_interval: 60s

  - platform: wifi_signal
    name: "RSSI"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: scd4x
    id: scd40
    co2:
      name: "CO2"
      id: "co2"
      # Unconditional: with the "All" source any channel can own the colour, so
      # the script re-derives the whole LED state rather than each sensor
      # guessing whether it is the selected one. led_evaluate also re-checks the
      # danger alarm, which is what makes the LED react within a sample instead
      # of waiting for the 60s reportAllValues tick.
      on_value:
        - script.execute: led_evaluate
    # OFF deliberately, and unlike upstream there is no runtime switch for it.
    # ASC re-baselines by treating the lowest CO2 seen over a multi-day window
    # as fresh outdoor air (~400ppm). That assumption holds for a sensor that
    # gets aired out and is actively wrong for one that lives indoors
    # permanently: an occupied room rarely bottoms out at 400ppm, so ASC would
    # walk the baseline down and under-report. Use the
    # `Calibrate SCD40 To 420ppm` button outdoors instead (see the README).
    # Upstream's toggle needs a script of raw I2C commands -- the SCD40 only
    # accepts the setting while idle and forgets it on power loss -- which is
    # not worth carrying for a setting that should stay off here.
    automatic_self_calibration: false
    # 10s to match the SEN55, so the LED tracks a CO2 change at roughly the rate
    # a person notices one. The SCD40 in periodic mode produces a fresh sample
    # every ~5s internally, so this reads real measurements rather than repeats
    # of a cached one.
    #
    # This does NOT speed up data logging. Node-RED -> InfluxDB consumes the
    # combined ${mqtt_topic}/state snapshot, which reportAllValues publishes on
    # its own 60s interval and which force-updates every component first. The
    # only cost here is that this sensor's individual state topic now publishes
    # 6x more often -- a few bytes a second, retained, not written to Influx.
    update_interval: 10s
    measurement_mode: "periodic"
    i2c_id: bus_a
    ambient_pressure_compensation_source: dps310pressure

  - platform: dps310
    id: dps_310
    pressure:
      name: "DPS310 Pressure"
      id: dps310pressure
      filters:
        - lambda: |-
            float offset = id(dps310_pressure_offset).state;
            return isnan(offset) ? x : x + offset;
    temperature:
      id: dps310temperature
    update_interval: 30s
    i2c_id: bus_a

  - platform: sen5x
    id: sen55
    pm_1_0:
      name: "PM <1µm Weight concentration"
      id: pm_1_0
      accuracy_decimals: 1
    pm_2_5:
      name: "PM <2.5µm Weight concentration"
      id: pm_2_5
      accuracy_decimals: 1
    pm_4_0:
      name: "PM <4µm Weight concentration"
      id: pm_4_0
      accuracy_decimals: 1
    pm_10_0:
      name: "PM <10µm Weight concentration"
      id: pm_10_0
      accuracy_decimals: 1
    temperature:
      name: "SEN55 Temperature"
      id: sen55_temperature
      filters:
        - lambda: return x - id(sen55_temperature_offset).state;
      accuracy_decimals: 1
    humidity:
      name: "SEN55 Humidity"
      id: sen55_humidity
      filters:
        - lambda: return x - id(sen55_humidity_offset).state;
      accuracy_decimals: 1
    voc:
      name: "SEN55 VOC"
      id: sen55_voc
      on_value:
        - script.execute: led_evaluate
      algorithm_tuning:
        # https://sensirion.com/media/documents/25AB572C/62B463AA/Sensirion_Engineering_Guidelines_SEN5x.pdf
        index_offset: 100
        learning_time_offset_hours: 72
        learning_time_gain_hours: 72
        gating_max_duration_minutes: 180
        std_initial: 50
        gain_factor: 230
    nox:
      name: "SEN55 NOX"
      id: sen55_nox
      on_value:
        - script.execute: led_evaluate
    acceleration_mode: low
    store_baseline: true
    # Some units misreport SEN54 on the product name register even though the
    # NOx element is present; forcing the model keeps NOx enabled. Needs the
    # model option from esphome 2026.7.2. (This unit is worse than a SEN54
    # misreport -- it answers the device-info read with all zeros, logging
    # "Type: UNKNOWN / Product ID: 0", so auto-detection can never enable NOx.)
    model: sen55
    address: 0x69
    update_interval: 10s

  - platform: template
    name: "PM 0.3 To 1 µm"
    id: pm0_3_to_1
    disabled_by_default: true
    lambda: return id(pm_1_0).state;
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  - platform: template
    name: "PM 1 To 2.5 µm"
    id: pm1_to_2_5
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_2_5).state - id(pm_1_0).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  - platform: template
    name: "PM 2.5 To 4 µm"
    id: pm2_5_to_4
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_4_0).state - id(pm_2_5).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  - platform: template
    name: "PM 4 To 10 µm"
    id: pm4_to_10
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_10_0).state - id(pm_4_0).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  # Named "PM AQI", not "NowCast AQI" as upstream has it. This component takes
  # the CURRENT pm_2_5/pm_10_0 values, runs each through the EPA breakpoint
  # table with linear interpolation, and publishes the max -- see
  # aqi_calculator.h. It keeps no history at all.
  #
  # NowCast is a different algorithm entirely: a weighted average over the
  # previous 12 HOURS of PM, with the weight derived from the min/max ratio in
  # that window. EPA built it so AirNow could report something comparable to the
  # 24h-averaged AQI in near-real-time while damping spikes. This component
  # structurally cannot be that -- there is no buffer to average over.
  #
  # "PM" also earns its place: a real EPA AQI is the max across PM2.5, PM10,
  # ozone, NO2, SO2 and CO. This device measures only the two particulate
  # channels, so on a bad ozone day the true outdoor AQI is higher than this
  # number and nothing here would know. (The breakpoints themselves are current
  # -- the first PM2.5 boundary is 9.1, the 2024 revised NAAQS, not the old
  # 12.1.)
  - platform: aqi
    name: "PM AQI"
    id: pm_aqi
    pm_2_5: pm_2_5
    pm_10_0: pm_10_0
    calculation_type: AQI
    device_class: aqi
    on_value:
      - script.execute: led_evaluate

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Light"
    pin: GPIO3
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 3
    rgb_order: grb
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
      # Air danger alarm. Cycles saturated colors with dark gaps between them --
      # the changing hue plus the blink is what makes it read as an alarm from
      # the corner of your eye rather than as ordinary status lighting (the
      # boot statusCheck already uses steady blue/green/yellow). Driven by the
      # airDangerCheck script, not selectable as a mood effect.
      - strobe:
          name: "Air Danger"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 150ms
            - state: false
              duration: 60ms
            - state: true
              brightness: 100%
              red: 100%
              green: 100%
              blue: 100%
              duration: 150ms
            - state: false
              duration: 60ms
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 150ms
            - state: false
              duration: 60ms
            - state: true
              brightness: 100%
              red: 100%
              green: 60%
              blue: 0%
              duration: 150ms
            - state: false
              duration: 60ms
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 100%
              duration: 150ms
            - state: false
              duration: 60ms

      # ---------------------------------------------------------------------
      # AMBIENCE EFFECTS. Appended at the END so the indices of everything
      # above are untouched (the MQTT light state reports effect_index, and
      # deployed consumers may have learned them).
      #
      # How these compose with everything else, which is the whole reason they
      # are effects rather than a script driving light.turn_on:
      #
      #   - `current_color` arrives as the band hue with the master brightness
      #     NOT applied -- AddressableLight::update_state pushes brightness into
      #     the colour correction (`set_local_brightness`) and only then returns
      #     early for the active effect. So scaling `current_color` by m does
      #     exactly what moving the brightness slider to m would do, and the
      #     day/night ramp, the band-5 dimming and led_pulse all keep working
      #     underneath without either effect knowing they exist.
      #   - Correction order is scale-by-brightness THEN gamma, so m needs no
      #     gamma compensation of its own to look linear.
      #   - An effect can only ever scale DOWN: the hue arrives with its
      #     brightest channel already at 255. Swinging symmetrically around the
      #     setpoint therefore needs headroom, which update_air_quality_led
      #     provides by raising the level by half the depth (and clamping at
      #     full, where the swing quietly becomes downward-only).
      #
      # Both effects hold their state in `static` locals reset on initial_run,
      # which is the documented addressable_lambda pattern -- the lambda is
      # compiled as a plain function, so there is nowhere else to put it.
      #
      # KNOWN LIMIT: at very low brightness (a night level of a few percent)
      # local_brightness leaves only a handful of pre-gamma steps, and gamma
      # compresses them further, so both effects will band visibly. That is an
      # 8-bit output limit, not a bug in the maths -- they are at their best at
      # moderate brightness.
      - addressable_lambda:
          name: "Breathing"
          update_interval: ${ambience_frame_ms}
          lambda: |-
            // Resting adult respiration: ~11-14 breaths/min, asymmetric, and
            // never twice the same. The asymmetry is what makes it read as
            // breathing rather than as a sine wave -- inhale is an active
            // muscular effort and is quick; exhale is largely passive and takes
            // longer; and there is a real pause at the bottom before the next
            // one starts. A symmetric waveform reads as a machine.
            static uint32_t breath_start = 0;
            static float breath_period = 0.0f;
            static float breath_amp = 1.0f;
            static float frac_in = 0.36f, frac_hold = 0.06f, frac_ex = 0.44f;
            static int breaths_until_sigh = 0;

            const float PI_F = 3.14159265f;
            const uint32_t now = millis();

            if (initial_run) {
              breath_period = 0.0f;      // forces a fresh cycle immediately
              breaths_until_sigh = 0;    // and makes the first breath a sigh
            }

            float elapsed = (float) (now - breath_start);
            if (breath_period <= 0.0f || elapsed >= breath_period) {
              breath_start = now;
              elapsed = 0.0f;

              // Every parameter is redrawn per breath. Real breathing varies
              // cycle to cycle (respiratory sinus arrhythmia is not subtle),
              // and a fixed period is the single thing that would give this
              // away as a loop.
              breath_period = ${breath_period_min_ms} +
                  random_float() * (float) (${breath_period_max_ms} - ${breath_period_min_ms});

              // Tighter than the waking version this started as. Breathing
              // gets both slower AND more regular as someone goes under, so
              // scaling the period up while leaving the jitter alone would
              // have read as laboured rather than asleep.
              breath_amp = 0.92f + random_float() * 0.16f;

              // Asleep, exhale lengthens relative to inhale and the pause at
              // the bottom grows -- that end-expiratory rest is most of what
              // separates "asleep" from "sitting quietly". Inhale 32%, brief
              // hold 4%, exhale 42%, leaving ~22% of the cycle at rest.
              frac_in   = 0.32f + (random_float() - 0.5f) * 0.04f;
              frac_hold = 0.04f + (random_float() - 0.5f) * 0.02f;
              frac_ex   = 0.42f + (random_float() - 0.5f) * 0.04f;

              if (breaths_until_sigh <= 0) {
                // A sigh. Humans take one every few minutes without noticing;
                // it is the detail that stops a long look at this feeling
                // mechanical. Deeper AND slower -- scaling only the depth
                // reads as a twitch.
                breath_amp *= 1.45f;
                breath_period *= 1.3f;
                // At this cadence 30-70 breaths is roughly 4-10 minutes, which
                // is about how often a sleeping adult actually sighs.
                breaths_until_sigh = 30 + (int) (random_float() * 40.0f);
              } else {
                breaths_until_sigh--;
              }
            }

            // w: 0 = empty, 1 = full. Both curves are raised cosines, so the
            // derivative is zero at every join -- inhale into hold, hold into
            // exhale, exhale into pause, pause into the next inhale. That is
            // what makes the whole cycle C1-continuous with no visible corner.
            const float u = elapsed / breath_period;
            float w;
            if (u < frac_in) {
              w = 0.5f - 0.5f * cosf(PI_F * (u / frac_in));
            } else if (u < frac_in + frac_hold) {
              w = 1.0f;
            } else if (u < frac_in + frac_hold + frac_ex) {
              w = 0.5f + 0.5f * cosf(PI_F * ((u - frac_in - frac_hold) / frac_ex));
            } else {
              w = 0.0f;
            }

            // Depth scales with the breath, so a sigh genuinely swings wider
            // rather than just lasting longer. Clamped well clear of 1.0: at
            // depth 1 the trough is black, which is not breathing, it is a
            // blink.
            float depth = (id(led_ambience_intensity).state / 100.0f) * ${ambience_depth_max} * breath_amp;
            if (depth > 0.85f) depth = 0.85f;
            if (depth < 0.0f) depth = 0.0f;

            const float m = 1.0f - depth * (1.0f - w);

            // Spatial + temporal dithering, so the seven-second curve is not
            // quantised onto the five PWM values a dim LED actually has. Each
            // effect keeps its own carry, so switching between them does not
            // inherit the other's residual. See ambience_dither.h.
            static ambience::DitherState dither;
            if (initial_run) {
              dither.err = 0.0f;
            }
            ambience::emit(it, current_color, m, dither);
      - addressable_lambda:
          name: "Steampunk"
          update_interval: ${ambience_frame_ms}
          lambda: |-
            // A firebox seen through a viewport: a slow, warm, wandering glow
            // with the occasional swell as something vents. Smooth by
            // construction rather than by filtering -- every term below is a
            // cosine or a raised-cosine interpolation, so the sum is C1 at
            // worst and there is nothing to smooth out.
            //
            // Deliberately NOT ESPHome's built-in `flicker`, which is per-frame
            // noise. Noise reads as a loose connection; this should read as
            // something large and hot changing its mind slowly.
            static uint32_t t_start = 0;
            static float walk_from = 0.0f, walk_to = 0.0f;
            static uint32_t walk_start = 0, walk_len = 2000;
            static uint32_t surge_start = 0, surge_len = 0, surge_next = 0;
            static bool surging = false;

            const float PI_F = 3.14159265f;
            const uint32_t now = millis();

            if (initial_run) {
              t_start = now;
              walk_from = 0.0f;
              walk_to = 0.0f;
              walk_start = now;
              walk_len = 2000;
              surging = false;
              surge_next = now + 6000;
            }

            const float t = (float) (now - t_start) / 1000.0f;

            // Three sines whose periods share no common multiple, so the sum
            // never repeats -- quasi-periodic motion that looks improvised
            // while costing three cosines a frame. The phase offsets stop them
            // all starting aligned, which would open with an obvious throb.
            const float s = 0.50f * sinf(2.0f * PI_F * t / 3.1f)
                          + 0.30f * sinf(2.0f * PI_F * t / 5.7f + 1.7f)
                          + 0.20f * sinf(2.0f * PI_F * t / 9.4f + 3.9f);

            // Genuine randomness on top of the deterministic sines: re-target
            // every 1.5-3s and ease across with a raised cosine, so the walk
            // itself has no corners.
            if (now - walk_start >= walk_len) {
              walk_from = walk_to;
              walk_to = (random_float() - 0.5f) * 0.30f;
              walk_start = now;
              walk_len = 1500 + (uint32_t) (random_float() * 1500.0f);
            }
            const float wu = (float) (now - walk_start) / (float) walk_len;
            const float walk = walk_from + (walk_to - walk_from) * (0.5f - 0.5f * cosf(PI_F * wu));

            // The vent. A single full raised-cosine bump, so it rises out of
            // and settles back into the ambient motion without a seam. This is
            // the beat that gives the effect a sense of machinery rather than
            // weather.
            float surge = 0.0f;
            if (!surging && now >= surge_next) {
              surging = true;
              surge_start = now;
              surge_len = 1500 + (uint32_t) (random_float() * 1500.0f);
            }
            if (surging) {
              const float su = (float) (now - surge_start) / (float) surge_len;
              if (su >= 1.0f) {
                surging = false;
                surge_next = now + 12000 + (uint32_t) (random_float() * 13000.0f);
              } else {
                surge = 0.35f * (0.5f - 0.5f * cosf(2.0f * PI_F * su));
              }
            }

            // A whisper of faster movement. Small enough not to read as
            // flicker, present enough that the glow is never quite still.
            const float shimmer = 0.05f * sinf(2.0f * PI_F * t / 0.73f);

            float w = 0.5f + 0.5f * s + walk + surge + shimmer;
            if (w > 1.0f) w = 1.0f;
            if (w < 0.0f) w = 0.0f;

            float depth = (id(led_ambience_intensity).state / 100.0f) * ${ambience_depth_max};
            if (depth > 0.85f) depth = 0.85f;
            if (depth < 0.0f) depth = 0.0f;

            const float m = 1.0f - depth * (1.0f - w);

            // Its own carry, separate from Breathing's. See ambience_dither.h.
            static ambience::DitherState dither;
            if (initial_run) {
              dither.err = 0.0f;
            }
            ambience::emit(it, current_color, m, dither);

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"

  - platform: factory_reset
    disabled_by_default: true
    name: "Factory Reset ESP"
    id: factory_reset_all

  - platform: template
    name: "Calibrate SCD40 To 420ppm"
    id: set_SCD40_calibrate
    on_press:
      - scd4x.perform_forced_calibration:
          value: 420
          id: scd40

  - platform: template
    name: "Clean SEN55"
    id: clean_sen55
    on_press:
      - sen5x.start_fan_autoclean: sen55

text_sensor:
  # Convert VOC Index To Text:
  # https://sensirion.com/media/documents/02232963/6294E043/Info_Note_VOC_Index.pdf
  - platform: template
    name: "VOC Quality"
    id: voc_quality
    icon: mdi:air-filter
    lambda: |-
      if (id(sen55_voc).state < 80) {
        return std::string("Improved");}
      else if (id(sen55_voc).state < 150) {
        return std::string("Normal");}
      else if (id(sen55_voc).state < 250) {
        return std::string("Abnormal");}
      else if (id(sen55_voc).state < 400) {
        return std::string("Very abnormal");}
      else if (id(sen55_voc).state >= 400) {
        return std::string("Extremely abnormal");}
      else {
        return std::string("Unknown");}

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      entity_category: "diagnostic"
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: "diagnostic"
  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

switch:
  # Whether the danger strobe is armed at all. ON = the LED strobes when a
  # reading crosses a danger threshold, always at 100%. OFF = no strobe, ever.
  #
  # This says nothing about what the LED does BETWEEN alarms, which is entirely
  # the LED Brightness slider's business: 0 is dark, anything above it is the
  # steady air-quality color from Air Quality LED Source. So "dark until
  # something is wrong" -- the quiet setup the alarm was designed around, where
  # dark itself means nothing is wrong -- is this switch on and the slider at 0,
  # and there is no third control for it.
  - platform: template
    name: "LED Alarm Mode"
    id: led_alarm_mode
    icon: mdi:alarm-light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    on_turn_on:
      - script.execute: apply_led_state
    on_turn_off:
      - script.execute: apply_led_state

  - platform: factory_reset
    id: factory_reset_switch
    internal: true

  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    # ALWAYS_ON, not RESTORE_DEFAULT_ON: this unit is permanently USB-powered,
    # so continuous mode is the only mode that should survive a reboot.
    # RESTORE_DEFAULT_ON persists an OFF, and three things can set one (the
    # dashboard's Setup card, the device web UI, a direct MQTT publish), so a
    # stray toggle would silently duty-cycle the device forever: data drops
    # from 1/min to ~1/5min, the air-danger LED is dark for most of each cycle,
    # and -- worst -- the SEN55 VOC/NOx gas index algorithms lose the
    # continuous runtime they need to hold their learned baselines. Forcing it
    # on at boot means a power cycle always recovers. Still toggleable at
    # runtime if you ever do want the battery duty cycle; it just won't stick.
    restore_mode: ALWAYS_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - lambda: |-
            id(deep_sleep_1).allow_deep_sleep();

script:
  - id: testScript
    then:
      if:
        condition:
          - lambda: "return id(runTest) == true;"
        then:
          - lambda: "id(runTest) = false;"
          - lambda: "id(testCycleCount) = 0;"
          - while:
              condition:
                - lambda: "return id(testCycleCount) < 5;"
              then:
                - if:
                    condition:
                      - lambda: "return id(dps310Passed) == false;"
                    then:
                      - if:
                          condition:
                            - lambda: "return id(dps310pressure).state > 800 && id(dps310pressure).state < 1200;"
                          then:
                            - lambda: "id(dps310Passed) = true;"
                - if:
                    condition:
                      - lambda: "return id(dps310Passed);"
                    then:
                      - lambda: "id(testCycleCount) = 10;"
                - lambda: "id(runTest) = false;"
                - delay: 1s
                - lambda: "id(testCycleCount) += 1;"
          - if:
              condition:
                - lambda: "return id(dps310Passed);"
              then:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 100%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light
              else:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 100%
                    green: 0%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light

  # Strobes the RGB LED through colors while any reading is at a level that is
  # actually harmful to breathe, and clears it once everything is back under.
  # Thresholds and their justification live in the substitutions at the top.
  #
  # Driven by led_evaluate off every air-quality sensor's on_value, so on USB
  # power it re-evaluates roughly every 10s. Also runs at the end of
  # reportAllValues, which guarantees the LED and the published snapshot can
  # never disagree about the same cycle, and which is the only evaluation that
  # happens in battery/deep-sleep mode -- one per wake, with the LED necessarily
  # dark while asleep. This is a mains-powered feature in practice.
  - id: airDangerCheck
    mode: single
    then:
      - lambda: |-
          // Do NOT name these after entity ids -- id(co2) generates `co2->state`,
          // so a local called `co2` shadows the entity pointer and fails to
          // compile with "base operand of '->' is not a pointer".
          // Mode gates the alarm, and nothing else does. The brightness slider
          // is deliberately NOT consulted here -- see the number's comment: an
          // alarm you can accidentally dim to nothing is not an alarm, so in
          // alarm mode the slider is inert and the strobe always runs at 100%.
          // If the alarm was firing when the mode changed, drop it and hand the
          // LED back to the steady colour, which turns itself off when the
          // slider is at 0 or the source is "Off".
          if (!id(led_alarm_mode).state) {
            if (id(air_danger_active)) {
              id(air_danger_active) = false;
              id(rgb_light).turn_off().perform();
              id(restore_air_quality_led).execute();
            }
            return;
          }

          const float co2_ppm = id(co2).state;
          const float aqi_val = id(pm_aqi).state;
          const float voc_val = id(sen55_voc).state;
          // NaN-guarded: a sensor that has not produced a reading yet (SCD40
          // needs a warm-up, and NOx/VOC start as NaN after a baseline reset)
          // must never be treated as a danger. Comparing NaN yields false
          // anyway, but being explicit keeps it obvious that a dead sensor
          // fails SAFE-looking -- see the caveat in the README.
          //
          // A threshold of 0 switches that channel off. The substitution is
          // textual, so the guard folds to `0 > 0` at compile time and the rest
          // of the clause is discarded -- a disabled channel is free, and the
          // reading is still taken and published regardless. VOC is off by
          // default here; see the substitutions at the top for why.
          const bool danger =
              (${danger_co2_ppm} > 0 && !isnan(co2_ppm) && co2_ppm >= ${danger_co2_ppm}) ||
              (${danger_aqi} > 0 && !isnan(aqi_val) && aqi_val >= ${danger_aqi}) ||
              (${danger_voc_index} > 0 && !isnan(voc_val) && voc_val >= ${danger_voc_index});

          if (danger == id(air_danger_active)) {
            return;  // no transition, leave the strobe running or the LED off
          }
          id(air_danger_active) = danger;

          if (danger) {
            ESP_LOGW("Apollo", "AIR DANGER: co2=%.0fppm aqi=%.0f voc=%.0f -- alarm ON", co2_ppm, aqi_val, voc_val);
            // A steady-mode attention blink may be mid-flight; it modulates
            // brightness and would fight the strobe for control of the light.
            id(led_pulse).stop();
            auto call = id(rgb_light).turn_on();
            // Hardcoded full brightness. The strobe's own colours are defined
            // at 100% and the master brightness would scale them, so this has
            // to be set explicitly -- otherwise the light would inherit
            // whatever the steady colour last left here.
            call.set_brightness(1.0f);
            call.set_effect("Air Danger");
            call.perform();
          } else {
            ESP_LOGI("Apollo", "Air back within safe limits -- alarm OFF");
            auto call = id(rgb_light).turn_off();
            call.perform();
            // Hand the LED back to the steady air-quality colour. That script
            // turns it off by itself when the source is "Off", so this stays
            // dark for anyone who has not enabled the feature.
            id(restore_air_quality_led).execute();
          }

  # Grades every air-quality channel onto one shared 0-5 severity scale and
  # stores the results in the air_band_* globals. Pure: reads sensor states,
  # writes globals, touches no hardware and no LED. Called from led_evaluate, so
  # it runs on every air-quality reading (~4 channels x 10s) and its output is
  # never more than one sample period old.
  #
  # This is the single source of truth for "how bad is it", consumed by
  # update_air_quality_led (which picks one channel or the worst-of, per the
  # source select) and by the publish-cadence interval (which always takes the
  # worst-of). Note what it deliberately does NOT consult: LED Brightness, the
  # source select, alarm mode, or whether the strobe is up. Those decide what
  # the light does, not what the air is -- keeping them out is what lets the
  # dashboard stay fast while the LED is switched off.
  #
  # Each metric has its own scale, but they all land on the same 0-5 band and
  # share one colour table, which is what makes the worst-of comparison
  # meaningful in the first place.
  - id: compute_air_bands
    mode: single
    then:
      - lambda: |-
          // One grader for every channel, driven by the band_cuts_* arrays in
          // globals -- see the long comment there for what each table means and
          // where its numbers come from. Four near-identical if-chains used to
          // live here; a loop over the shared table is what makes it possible
          // for publish_band_config to hand consumers the same numbers instead
          // of everyone keeping their own copy.
          auto grade = [](float x, const int *cuts, int n) -> int {
            if (isnan(x)) return -1;   // no reading: does not vote, never green
            for (int i = 0; i < n; i++) {
              if (x <= (float) cuts[i]) return i;
            }
            return n;                  // past the last cut = worst band
          };

          id(air_band_aqi) = grade(id(pm_aqi).state,    id(band_cuts_aqi), 5);
          id(air_band_co2) = grade(id(co2).state,       id(band_cuts_co2), 5);
          id(air_band_voc) = grade(id(sen55_voc).state, id(band_cuts_voc), 3);
          id(air_band_nox) = grade(id(sen55_nox).state, id(band_cuts_nox), 4);

          // Worst-of across every channel the device has, so a spike on any one
          // of them shows up. A channel with no reading yet is -1 and simply
          // does not vote: a warming-up SCD40 or a post-reset VOC baseline can
          // neither pin the result at green nor invent a red. Stays -1 only
          // while EVERY channel is unreadable.
          id(air_band_worst) =
              std::max(std::max(id(air_band_aqi), id(air_band_co2)),
                       std::max(id(air_band_voc), id(air_band_nox)));

  # Publishes the band tables to ${mqtt_topic}/config/bands, RETAINED, so any
  # consumer can colour its UI from the same numbers this device grades and
  # lights its LED with. Retained matters: a dashboard that starts hours after
  # the device did still gets the table from the broker immediately, and a
  # sleeping device does not leave it blind.
  #
  # Serialised straight out of the band_cuts_* globals -- this script contains no
  # thresholds of its own, which is the whole point. Change a number in globals
  # and the LED, the publish cadence and every dashboard move together.
  #
  # `colors` is the LED's own band palette as hex, so a consumer can match the
  # light on the wall rather than guessing at "yellow". Band 5 is the same red as
  # band 3 because the LED distinguishes them by brightness (see the dimming in
  # update_air_quality_led -- normalize_color() would otherwise rescale a dark
  # red straight back to pure red); a screen has no such constraint, hence the
  # separate darker hex here.
  #
  # Deliberately no band NAMES. Upstream used EPA's category words (Good ...
  # Hazardous), which are legally defined terms for outdoor criteria pollutants
  # and are only meaningful for the AQI channel -- reusing them for CO2, which
  # EPA does not regulate at all, borrows authority that does not exist. A
  # consumer that wants words has to choose its own and own that choice.
  - id: publish_band_config
    mode: single
    then:
      - mqtt.publish_json:
          topic: ${mqtt_topic}/config/bands
          retain: true
          payload: |-
            // Upper bound INCLUSIVE: band i is the first i where value <=
            // cuts[i], else cuts.size(). Stated in the payload so a consumer
            // does not have to infer it or read this file.
            root["compare"] = "lte";
            root["bands"] = 6;
            JsonArray aqi = root.createNestedArray("aqi");
            for (int i = 0; i < 5; i++) aqi.add(id(band_cuts_aqi)[i]);
            JsonArray co2 = root.createNestedArray("co2");
            for (int i = 0; i < 5; i++) co2.add(id(band_cuts_co2)[i]);
            // Deliberately shorter than the absolute scales: a relative
            // deviation index must not be able to claim the top severity bands.
            // VOC 3, NOx 4 -- see their comments in globals.
            JsonArray voc = root.createNestedArray("voc");
            for (int i = 0; i < 3; i++) voc.add(id(band_cuts_voc)[i]);
            JsonArray nox = root.createNestedArray("nox");
            for (int i = 0; i < 4; i++) nox.add(id(band_cuts_nox)[i]);
            JsonArray colors = root.createNestedArray("colors");
            colors.add("#00c000");  // 0
            colors.add("#c0c000");  // 1
            colors.add("#e08000");  // 2
            colors.add("#e00000");  // 3
            colors.add("#9900ff");  // 4
            colors.add("#600000");  // 5 -- LED shows dimmed red, not a new hue
            root["elevated_band"] = ${publish_elevated_band};
            root["period_s"] = ${publish_period_s};
            root["period_elevated_s"] = ${publish_period_elevated_s};
            root["firmware_version"] = "${version}";

  # Stock behaviour, ported from upstream Core.yaml. Paints rgb_light with the
  # severity band of whichever metric air_quality_led_source names.
  - id: update_air_quality_led
    then:
      - lambda: |-
          // The select's restore_value publishes during component setup and
          // fires on_value before rgb_light (esp32_rmt_led_strip) is
          // initialised; touching the light then faults in schedule_show().
          if (millis() < 5000) {
            return;
          }

          // statusCheck (boot/button status flash) and testScript own the LED
          // while they run; don't repaint underneath them.
          if (id(statusCheck).is_running() || id(testScript).is_running()) {
            return;
          }

          // Local addition, not in upstream: this firmware also has the Air
          // Danger strobe, which must outrank a steady status colour. While the
          // alarm is up, leave it alone -- airDangerCheck calls this script
          // again once the air clears, which repaints the correct band.
          if (id(air_danger_active)) {
            return;
          }

          // Everything below computes a DESIRED state -- band (-1 = LED off)
          // plus a brightness -- and applies it exactly once at the bottom,
          // through the dedup guard. Nothing here may touch rgb_light directly.
          int band = -1;

          // The steady brightness is the day/night interpolation, not the raw
          // slider. sun_day_factor is 1.0 in daylight, 0.0 once it is properly
          // dark, and eases between the two across twilight -- see
          // sun_dim_evaluate, which is the only writer. Both endpoints are read
          // fresh here rather than cached, so moving either slider takes effect
          // on the next repaint at whatever point in the ramp we are at.
          //
          // Equal endpoints (the shipped default) collapse this to the previous
          // behaviour exactly: the factor cancels out and level is the slider.
          float day_pct = id(air_quality_led_brightness).state;
          float night_pct = id(air_quality_led_night_brightness).state;
          // A template number reads NaN until its restored/initial value has
          // been published -- only reachable in the first moments of boot, but
          // NaN survives every comparison below (the <= 0 master-off included)
          // and would reach set_brightness intact, painting an undefined
          // brightness. Pin each endpoint to the other, or to full.
          if (isnan(day_pct)) day_pct = isnan(night_pct) ? 100.0f : night_pct;
          if (isnan(night_pct)) night_pct = day_pct;

          float level = (night_pct + (day_pct - night_pct) * id(sun_day_factor)) / 100.0f;

          const std::string src = id(air_quality_led_source).current_option();

          // Bands themselves are computed by compute_air_bands off every sensor
          // reading; this only chooses which one to paint. The strings must
          // match the select's options EXACTLY -- an unrecognised name falls
          // through every branch and leaves band at -1, which reads as a dark
          // LED rather than as an error. (That is how the "NowCast AQI" ->
          // "PM AQI" rename silently switched the LED off for anyone who had
          // pinned it to that channel.)
          //
          // Master off is folded into the head of the same chain so there is
          // exactly one place that decides the band. Note what is NOT consulted
          // here: alarm mode. The strobe outranks this painter through the
          // air_danger_active guard above, not by suppressing it, so the two
          // compose -- brightness 0 is "dark between alarms", any other value
          // is "show me the band between alarms", and the alarm behaves the
          // same either way.
          //
          // The test is on the EFFECTIVE level, so a night brightness of 0 is
          // simply this same master-off arriving at dusk and leaving at dawn:
          // an LED that is dark overnight and still strobes for an emergency
          // needs no new control, just a 0 in the night slider.
          if (level <= 0.0f || src == "Off") {
            band = -1;
          } else if (src == "All") {
            band = id(air_band_worst);
          } else if (src == "PM AQI") {
            band = id(air_band_aqi);
          } else if (src == "CO2") {
            band = id(air_band_co2);
          } else if (src == "VOC Index") {
            band = id(air_band_voc);
          } else if (src == "NOx Index") {
            band = id(air_band_nox);
          }
          // band is still -1 here if every selected channel read NaN: stay dark
          // rather than hold a stale colour that would look like a measurement.

          // Maroon - Hazardous, expressed as a DIMMED red rather than a dark red
          // channel value. Every LightCall runs normalize_color(), which
          // rescales RGB so the brightest channel is 1.0, so the obvious
          // set_rgb(0.5, 0, 0) is pushed straight back to pure red and would
          // render pixel-identical to band 3. Brightness is the only axis left
          // that survives normalisation. Applied here, before the dedup
          // comparison, so the cached level matches what was really sent.
          if (band == 5) {
            level *= 0.45f;
          }

          // Ambience headroom. An addressable effect can only scale the colour
          // DOWN -- the hue arrives with its brightest channel already at 255 --
          // so for the modulation to swing symmetrically ABOUT the setpoint
          // rather than only below it, the light has to sit half a depth above
          // it and let the effect take back the difference. Same shape as the
          // band-5 multiplier above, and applied in the same place so the
          // cached level still describes what was really sent.
          //
          // Clamped at full, where the swing quietly degrades to downward-only.
          // That is the honest failure: at 100% brightness there is no headroom
          // to be had, and the alternative -- silently lowering the setpoint to
          // make room -- would be the feature editing a setting the user owns.
          //
          // Decided HERE, and stored, rather than re-derived in
          // apply_led_ambience: both need the same answer, and the band is a
          // local that only exists in this pass. Two copies of this condition
          // would eventually disagree, and the visible symptom would be an LED
          // sitting permanently half a depth too bright with no effect running.
          id(led_ambience_active) =
              (id(led_ambience).current_option() != "Off") &&
              band >= 0 && band <= ${ambience_max_band};
          if (id(led_ambience_active)) {
            const float depth = (id(led_ambience_intensity).state / 100.0f) * ${ambience_depth_max};
            level *= (1.0f + depth * 0.5f);
            if (level > 1.0f) level = 1.0f;
          }

          if (band < 0) {
            level = 0.0f;
          }

          // Dedup. Skip the repaint when the desired state is already on the
          // LED, so a steady-state device is silent on the broker. The is_on
          // cross-check catches anything that grabbed the light without going
          // through here (testScript's direct turn_off, a manual MQTT light
          // command), where the cache alone would wrongly say "no work to do".
          if (band == id(led_last_band) && fabsf(level - id(led_last_level)) < 0.001f &&
              id(rgb_light).remote_values.is_on() == (band >= 0)) {
            return;
          }
          // A WORSENING band change earns an attention pulse; everything else
          // just crossfades. A previous band below 0 is deliberately NOT a
          // worsening: the LED was off, or its state was unknown after a status
          // flash, and neither says anything about the air having got worse.
          const int prev = id(led_last_band);
          const bool worse = (prev >= 0 && band > prev);

          id(led_last_band) = band;
          id(led_last_level) = level;

          if (band < 0) {
            id(led_pulse).stop();
            id(rgb_light).turn_off().perform();
            return;
          }

          // Increasing severity, 0-5. Deliberately NOT named here: these were
          // upstream's EPA AQI category names (Good ... Hazardous), which are
          // legally defined terms for outdoor criteria pollutants and are only
          // correct for the AQI channel. Reusing them for CO2 -- which EPA does
          // not regulate at all -- borrowed authority that does not exist. The
          // band table in the README labels each channel in its own terms.
          auto call = id(rgb_light).turn_on();
          switch (band) {
            case 0: call.set_rgb(0.0f, 1.0f, 0.0f); break;   // Green
            case 1: call.set_rgb(1.0f, 1.0f, 0.0f); break;   // Yellow
            case 2: call.set_rgb(1.0f, 0.5f, 0.0f); break;   // Orange
            case 3: call.set_rgb(1.0f, 0.0f, 0.0f); break;   // Red
            case 4: call.set_rgb(0.6f, 0.0f, 1.0f); break;   // Purple
            case 5: call.set_rgb(1.0f, 0.0f, 0.0f); break;   // Red, dimmed above
          }
          call.set_brightness(level);
          // Every change eases across, worsening included -- led_pulse waits
          // out this fade before it swells, so the two read as one gesture
          // (fade to the new colour, swell once, settle) rather than fighting.
          call.set_transition_length(1000);
          call.perform();

          if (worse) {
            id(led_pulse).execute();
          } else {
            // An improvement while a pulse is mid-flight must cancel it --
            // otherwise the blink keeps dipping the brightness of a colour that
            // no longer means what the pulse was announcing.
            id(led_pulse).stop();
          }

  # Night must never be brighter than day. Called from BOTH brightness numbers'
  # on_value, which is what makes one rule cover both directions: raising night
  # past day pulls it back, and lowering day below night drags night down with
  # it. Either way the pair converges on night == day.
  #
  # Enforced on the device rather than only in the dashboard because three
  # things can set these -- the dashboard, the device's own web UI, and a raw
  # MQTT publish -- and an invariant only one of them respects is not one.
  #
  # DEFERRED BY A TICK, and that is load-bearing rather than cosmetic.
  #
  # This runs from a number's on_value, and in the night case it wants to write
  # the very number whose callback it is inside. TemplateNumber::control() does
  # its work in this order:
  #
  #     set_trigger_.trigger(v);            // -- we are called from in here
  #     if (optimistic_) publish_state(v);  //    (via the state callback)
  #     if (restore_value_) pref_.save(&v); // -- runs AFTER we return
  #
  # so a write issued from inside the callback completes first, and then the
  # OUTER call resumes and saves and publishes the value we just rejected. The
  # device ends up holding the clamped value in memory while the retained MQTT
  # state and the flash copy both say the rejected one -- observed exactly that
  # way: `night 80% exceeds day 41% - clamping` in the log, and the state topic
  # still reporting 80.
  #
  # Letting the current call unwind first makes the clamp an ordinary outermost
  # write, with nothing left to run after it. mode: restart because the write
  # re-triggers this script, and a burst of slider drags should settle once.
  - id: clamp_night_to_day
    mode: restart
    then:
      - delay: 1ms
      - lambda: |-
          const float day = id(air_quality_led_brightness).state;
          const float night = id(air_quality_led_night_brightness).state;
          if (isnan(day) || isnan(night) || night <= day) {
            return;
          }
          ESP_LOGI("led", "night brightness %.0f%% exceeds day %.0f%% - clamping to day", night, day);
          id(air_quality_led_night_brightness).make_call().set_value(day).perform();

  # Puts the selected ambience effect on the light, or takes it off. The only
  # place that calls set_effect for ambience.
  #
  # Everything that can own the LED outranks this, and each is a separate
  # clause rather than one combined test because they become true for
  # different reasons:
  #
  #   - the danger strobe IS an effect, and ESPHome runs one at a time, so
  #     starting ambience during an alarm would silently cancel the alarm;
  #   - statusCheck and testScript paint the light directly and would be
  #     modulated underneath;
  #   - a dark LED has nothing to modulate. update_air_quality_led's turn_off()
  #     already clears the effect for us (LightCall auto-stops effects on an
  #     explicit turn off), so this only has to decline to start one.
  #
  # The get_effect_name() check is not an optimisation, it is what keeps this
  # callable from led_evaluate -- i.e. on every sensor reading, several times a
  # minute. A LightCall publishes the light's MQTT state whether or not anything
  # changed, so without this the broker would carry a steady drip of identical
  # messages for a light that is doing exactly what it was already doing.
  - id: apply_led_ambience
    mode: single
    then:
      - lambda: |-
          if (millis() < 5000) {
            return;
          }
          if (id(statusCheck).is_running() || id(testScript).is_running()) {
            return;
          }

          const bool want_effect =
              id(led_ambience_active) && !id(air_danger_active) && id(rgb_light).remote_values.is_on();

          // The dithering needs frames faster than ESPHome's default 16ms loop
          // gate allows. Tied to the effect rather than left on, so the cost is
          // paid only while something is using it. See ambience_dither.h.
          ambience::set_fast_loop(want_effect);

          if (!want_effect) {
            // Nothing to do unless an ambience effect is actually up. Checking
            // the name rather than a flag means a strobe raised underneath us
            // is left alone -- clearing "the effect" unconditionally here would
            // cancel the alarm.
            const auto cur = id(rgb_light).get_effect_name();
            if (cur == "None" || cur == "Air Danger" || !id(rgb_light).remote_values.is_on()) {
              return;
            }
            id(rgb_light).turn_on().set_effect("None").perform();
            return;
          }

          const std::string want = id(led_ambience).current_option();
          if (id(rgb_light).get_effect_name() == want) {
            return;
          }
          // Effect and transition cannot share a LightCall (ESPHome rejects the
          // pair), which is why this is its own call rather than something
          // update_air_quality_led folds into the repaint it just did.
          id(rgb_light).turn_on().set_effect(want).perform();

  # Day/night ramp. The ONLY writer of sun_day_factor: it maps the sun's
  # elevation onto 0.0 (night) .. 1.0 (day) and hands the repaint to
  # update_air_quality_led, which owns every actual LightCall. Nothing here
  # touches rgb_light, so the ramp cannot fight the band painter, the danger
  # strobe or the attention pulse -- it changes one number and asks for a
  # repaint, and all the existing precedence rules still apply on top.
  #
  # Elevation, not a clock offset. ${sun_fade_high_deg} and above is full day,
  # ${sun_fade_low_deg} and below is full night, linear in between -- so the
  # ramp lengthens in winter and shortens in summer on its own, and no timezone
  # is involved. See the substitutions for why those two numbers.
  #
  # Runs every ${sun_dim_interval}, which is far more often than the result
  # meaningfully moves. The quantise-to-whole-percent gate at the bottom is what
  # makes that cheap: across a ~40 min twilight the effective brightness passes
  # through at most ~90 distinct percents (fewer, when the two setpoints are
  # closer together), and outside twilight it produces no calls at all. Without
  # the gate this would repaint -- and publish an MQTT light state -- twice a
  # minute forever.
  #
  # mode: single, and there are no delays here, so it can never overlap itself.
  - id: sun_dim_evaluate
    mode: single
    then:
      - lambda: |-
          // Before the light exists, same guard as update_air_quality_led. The
          // first interval tick can land during setup.
          if (millis() < 5000) {
            return;
          }

          // A clock we do not trust means no dimming at all. sun.elevation()
          // will happily answer from a 1970 epoch, and the answer would be
          // wrong by hours -- an LED dark at noon looks like a dead device,
          // while an LED bright at midnight is merely the behaviour everyone
          // had before this feature. So every failure here holds DAY.
          float f = 1.0f;
          if (id(sntp_time).now().is_valid()) {
            const double elev = id(air1_sun).elevation();
            const float hi = ${sun_fade_high_deg};
            const float lo = ${sun_fade_low_deg};
            if (hi <= lo) {
              // Misconfigured (or deliberately equal) window: degrade to a hard
              // cut at the threshold rather than dividing by zero.
              f = (elev >= hi) ? 1.0f : 0.0f;
            } else {
              f = (float) ((elev - lo) / (hi - lo));
              if (f < 0.0f) f = 0.0f;
              if (f > 1.0f) f = 1.0f;
            }
          }
          id(sun_day_factor) = f;

          // Mirror update_air_quality_led's endpoint handling so the gate is
          // computed on the same numbers the painter will use. This is only the
          // gate -- the painter re-derives the real level itself.
          float day_pct = id(air_quality_led_brightness).state;
          float night_pct = id(air_quality_led_night_brightness).state;
          if (isnan(day_pct)) day_pct = isnan(night_pct) ? 100.0f : night_pct;
          if (isnan(night_pct)) night_pct = day_pct;

          const int pct = (int) roundf(night_pct + (day_pct - night_pct) * f);
          if (pct == id(led_dim_last_pct)) {
            return;
          }
          id(led_dim_last_pct) = pct;

          ESP_LOGD("sun", "elevation %.2f deg -> day factor %.3f, steady LED %d%%",
                   id(sntp_time).now().is_valid() ? id(air1_sun).elevation() : 0.0,
                   f, pct);
          id(update_air_quality_led).execute();

  # Attention swell for a worsening band change, fired by update_air_quality_led
  # once it has painted the new colour. One smooth rise to full brightness and
  # back down to the steady level -- not a blink. Deliberately modulates ONLY
  # brightness: a LightCall changes just the fields it sets, so the colour
  # painted a moment earlier is preserved and this script never needs its own
  # copy of the band colour table.
  #
  # The opening delay waits out update_air_quality_led's 1s colour crossfade, so
  # the whole thing reads as one gesture: fade to the new colour, swell once,
  # settle. Starting the swell during the fade would just fight it.
  #
  # mode: restart so a second degradation part-way through (yellow -> orange ->
  # red in quick succession) restarts the gesture on the newer colour rather
  # than queueing a second one. update_air_quality_led calls stop() on it
  # whenever the air improves or the LED goes dark, and airDangerCheck stops it
  # before raising the strobe -- in all three cases a swell left running would
  # be modulating a colour that no longer means what it was announcing.
  #
  # NOTE: the swell needs headroom above the steady level to be visible. With
  # LED Brightness at 100% and a band below Hazardous, steady IS full brightness
  # and there is nothing to swell into.
  - id: led_pulse
    mode: restart
    then:
      - delay: 1s
      - light.turn_on:
          id: rgb_light
          brightness: 100%
          transition_length: 500ms
      - delay: 500ms
      - light.turn_on:
          id: rgb_light
          brightness: !lambda "return id(led_last_level);"
          transition_length: 800ms

  # Re-derives everything that depends on the current readings: grade the air,
  # then the alarm, then the steady colour (which no-ops while the alarm owns
  # the light). Hung off every air-quality sensor's on_value, so the strobe, the
  # colour AND the publish cadence all react within one sample period instead of
  # waiting for the next reportAllValues tick. Cheap enough to run that often --
  # three lambdas, no delays, no I/O, and the last two bail early when nothing
  # has changed.
  #
  # compute_air_bands goes first and unconditionally: the two scripts after it
  # both have early-return guards (alarm active, statusCheck running), and the
  # cadence must keep tracking the air through exactly those situations. Running
  # it here rather than inside update_air_quality_led is also what keeps the
  # bands honest when the LED is switched off entirely.
  #
  # mode: single is safe precisely because there are no delays here: all three
  # callees are pure lambdas that run to completion synchronously, so this can
  # never still be running when the next sensor fires. (update_air_quality_led
  # may dispatch led_pulse, which does have delays -- but execute() only
  # schedules it, so this chain still returns immediately.)
  - id: led_evaluate
    mode: single
    then:
      - script.execute: compute_air_bands
      - script.execute: airDangerCheck
      - script.execute: update_air_quality_led
      # Last, and after the painter: it consumes led_ambience_active, which
      # update_air_quality_led has just derived from the band it painted. Its
      # own dedup makes running it this often free.
      - script.execute: apply_led_ambience

  # Short delay so the caller's own light action lands first and
  # update_air_quality_led's is_running() guard passes. mode: restart so a
  # burst of callers collapses into one repaint.
  # Re-applies whatever the two LED switches now say. Clearing
  # air_danger_active first forces airDangerCheck past its "no transition"
  # early return, so flipping into alarm mode while the air is already bad
  # starts the strobe immediately instead of waiting for the next threshold
  # crossing. mode: restart so double-tapping a toggle settles once.
  - id: apply_led_state
    mode: restart
    then:
      - lambda: "id(air_danger_active) = false;"
      - script.execute: airDangerCheck
      - script.execute: restore_air_quality_led

  - id: restore_air_quality_led
    mode: restart
    then:
      # Invalidate the dedup cache. This script is the universal "something else
      # was driving the LED, hand it back" path -- boot/button statusCheck, the
      # danger strobe clearing, a mode change. In every case the light is
      # showing something the cache does not describe, and statusCheck in
      # particular can leave it ON in a colour that would otherwise compare
      # equal to the cached band and be skipped.
      - lambda: "id(led_last_band) = -2;"
      - delay: 200ms
      - script.execute: update_air_quality_led
      # This is the universal hand-back path, so it is also where ambience comes
      # back after whatever took the light away -- an alarm clearing, a status
      # flash ending, a mode change. Without it the LED would return to the
      # right colour with the effect silently dropped.
      - script.execute: apply_led_ambience

  - id: statusCheck
    then:
      - if:
          condition:
            lambda: "return id(mqtt_client).is_connected();"
          then:
            - logger.log: "Apollo Automation: Connected to MQTT broker"
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected to WiFi, MQTT broker unreachable"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not connected to WiFi"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      # Upstream turns the LED off here; hand back to the air-quality
      # colour instead, which is a no-op when the source is "Off".
      - script.execute: restore_air_quality_led

  - id: reportAllValues
    then:
      - component.update: sen55
      - component.update: dps_310
      - component.update: scd40
      - component.update: wifi_signal_db
      - component.update: sys_esp_temperature
      - component.update: sys_uptime
      - component.update: pm0_3_to_1
      - component.update: pm1_to_2_5
      - component.update: pm2_5_to_4
      - component.update: pm4_to_10
      - component.update: voc_quality
      - delay: 500ms
      - mqtt.publish_json:
          topic: ${mqtt_topic}/state
          payload: |-
            root["co2_ppm"] = id(co2).state;
            root["pressure_hpa"] = id(dps310pressure).state;
            root["temperature_c"] = id(sen55_temperature).state;
            root["humidity_pct"] = id(sen55_humidity).state;
            root["pm1_0_ugm3"] = id(pm_1_0).state;
            root["pm2_5_ugm3"] = id(pm_2_5).state;
            root["pm4_0_ugm3"] = id(pm_4_0).state;
            root["pm10_0_ugm3"] = id(pm_10_0).state;
            root["voc_index"] = id(sen55_voc).state;
            root["nox_index"] = id(sen55_nox).state;
            root["voc_quality"] = id(voc_quality).state;
            root["aqi"] = id(pm_aqi).state;
            // The 0-5 severity band this snapshot represents (-1 = nothing
            // readable), worst-of across PM AQI, CO2, VOC and NOx. Published so
            // downstream consumers do not have to re-derive it from the raw
            // values against their own copy of the thresholds -- which is how a
            // dashboard ends up showing green while the LED on the device is
            // yellow. It is also what tells a consumer how fast this device is
            // currently publishing: above 0 means the elevated rate.
            root["air_band"] = id(air_band_worst);
            root["wifi_rssi_db"] = id(wifi_signal_db).state;
            root["esp_temperature_c"] = id(sys_esp_temperature).state;
            root["uptime_s"] = id(sys_uptime).state;
            // Day/night ramp readback. Both ride the existing combined snapshot
            // rather than becoming their own entities, so watching the ramp
            // costs no extra MQTT traffic at all.
            //
            // led_brightness_effective_pct is the STEADY brightness the ramp is
            // currently asking for -- the interpolation between the two
            // setpoints, before the band-5 dimming and before any alarm strobe
            // or attention pulse, which are momentary and override it. -1 while
            // it has not been computed yet (first seconds after boot).
            //
            // sun_elevation_deg is OMITTED rather than sent as 0 while the
            // clock is invalid -- 0 is a real elevation (the horizon) and would
            // read as dusk. Absent is the same convention the MICS-4514 fields
            // use, and consumers already drop keys they did not get.
            root["led_brightness_effective_pct"] = id(led_dim_last_pct);
            if (id(sntp_time).now().is_valid()) {
              root["sun_elevation_deg"] = id(air1_sun).elevation();
            }
            root["firmware_version"] = "${version}";
      # Re-evaluate the air-danger alarm against the readings just published,
      # so the LED and the snapshot can never disagree about the same cycle.
      - script.execute: airDangerCheck
