# Apollo AIR-1 — MQTT-only firmware (no Home Assistant)
#
# Forked from the official ApolloAutomation/AIR-1 ESPHome config:
#   https://github.com/ApolloAutomation/AIR-1/blob/main/Integrations/ESPHome/Core.yaml
# (ESP32-C3, i2c pins, sensor platforms, deep-sleep timing, and RGB status logic
# are taken directly from that source.)
#
# Changes from upstream:
#   - `api:` (Home Assistant native API) removed entirely, replaced with `mqtt:`.
#   - The "OTA Mode" binary_sensor (which mirrored a Home Assistant input_boolean
#     over the API) is gone. Its job — keep the device awake instead of deep-sleeping
#     — is now done by the existing `prevent_sleep` switch alone, which you can
#     trigger via a long (3s) button press or by publishing to its MQTT command
#     topic. See apollo-air1-mqtt-README.md for the OTA procedure.
#   - `reportAllValues` now also publishes one combined JSON snapshot to
#     `${mqtt_topic}/state`, so a timeseries consumer can ingest a single message
#     per wake cycle instead of joining ~20 separate per-entity topics.
#   - `statusCheck` (the boot LED color) now reflects MQTT broker connectivity
#     instead of Home Assistant API connectivity.
#   - The MICS-4514 gas sensor (NO2/CO/H2/ethanol/methane/ammonia) is removed,
#     because the unit this was written for does not have that optional add-on
#     and the component would only fail its I2C init and publish null gas
#     fields. The CO2 add-on (SCD40) is kept. If your unit HAS the MICS-4514,
#     copy the `mics_4514:` block back in from upstream `Core.yaml`.
#   - Continuous-mode data: a 60s `interval:` re-publishes the combined
#     `${mqtt_topic}/state` snapshot whenever `prevent_sleep` is on (the
#     default). On USB power the device stays awake and streams one point per
#     minute; on battery (prevent_sleep off) it reverts to one publish per
#     deep-sleep wake. See apollo-air1-mqtt-README.md.
#   - Air danger alarm: the RGB LED strobes through colors while CO2, AQI or
#     VOC is at a genuinely harmful level. Each channel has its own threshold
#     substitution below, and setting one to 0 switches that channel off — VOC
#     ships off. The strobe always runs at 100% and ignores the LED Brightness
#     slider. Upstream drives the LED as a continuous air-quality indicator via
#     an "Air Quality LED Source" select; this is instead a quiet LED that only
#     lights for an emergency. See the README.
#   - Combined air-quality LED: the "Air Quality LED Source" select gains an
#     "All" option (the new default), which colours the LED by the WORST band
#     across PM AQI, CO2, VOC and NOx instead of one chosen metric. The
#     LED repaints on every sensor reading rather than once per publish.
#   - MQTT-triggered pull OTA: publish a firmware URL to `${mqtt_topic}/command/ota`
#     and the device downloads + installs it itself. Push OTA (`esphome run`)
#     needs the device's address, which is `apollo-air-1-<mac>.local` thanks to
#     name_add_mac_suffix and is not something you necessarily have when the unit
#     is deployed; the broker is always reachable because the device dials out to
#     it. See "Updating (OTA)" in the README.
#
# Everything site-specific (broker host, credentials, CA certificate, firmware
# publish location) lives in secrets.yaml — see apollo-air1-mqtt.secrets.yaml.example.
# The only things to change here are the substitutions immediately below.

substitutions:
  name: apollo-air-1
  friendly_name: "Apollo AIR-1"
  version: "1.1.13-mqtt"
  # Root of this device's MQTT topic tree. Everything else is derived from it:
  #   ${mqtt_topic}/state              combined JSON snapshot (the data path)
  #   ${mqtt_topic}/status             online/offline (birth + LWT)
  #   ${mqtt_topic}/command/ota        pull-OTA trigger
  #   ${mqtt_topic}/<domain>/<id>/...  ESPHome's per-entity state/command topics
  mqtt_topic: esphome/apollo-air-1
  # 8883 = TLS (requires mqtt_ca_cert in secrets.yaml). For a plaintext broker,
  # set this to 1883 AND comment out the `certificate_authority:` line below.
  mqtt_port: "8883"

  # --- Air danger alarm ------------------------------------------------------
  # Thresholds at which the RGB LED strobes through colors as a get-out-of-the-
  # room signal. These are deliberately set at genuinely HARMFUL levels, not
  # merely "poor air" ones -- an alarm that cries wolf at a stuffy 1200ppm gets
  # ignored when it matters. Node-RED already sends a Gotify nudge at the softer
  # 1000ppm / AQI 100 marks; this is the tier above that.
  #
  #   co2   5000 ppm : the ACGIH TLV / OSHA PEL 8-hour occupational limit.
  #                    1000-2000 is stuffy and measurably hurts concentration,
  #                    but is not itself dangerous.
  #   aqi   200      : EPA "Very Unhealthy" -- health alert, everyone may
  #                    experience serious effects. Derived from PM2.5 + PM10,
  #                    so particulates are already covered by this one number.
  #   voc   0        : DISABLED. Set to 400 for the top band of the VOC Quality
  #                    text sensor ("Extremely abnormal"), or any 1-500 value.
  #
  # Any threshold set to 0 is off -- the clause is a compile-time constant, so a
  # disabled channel costs nothing at runtime and the sensor is still measured
  # and published either way. Only the LED trigger goes away.
  #
  # VOC ships disabled here, which is a judgement about placement rather than
  # about the sensor. The VOC Index is RELATIVE to a ~72h learned baseline rather
  # than an absolute concentration, so it answers "is this different from recent
  # normal?", not "is this harmful?" -- ordinary domestic events (cleaning spray,
  # deodorant, a freshly opened package off-gassing) reach the top band with
  # nothing actually wrong. In the bedroom this unit sits in, that is a light
  # strobing at you overnight, and a nuisance alarm is one you stop reading.
  # In a workshop, garage, or lab -- somewhere solvent vapour is a real hazard
  # and a spike genuinely means something -- set this to 400 and it works as
  # before. CO2 and AQI stay on because both are absolute, calibrated limits.
  danger_co2_ppm: "5000"
  danger_aqi: "200"
  danger_voc_index: "0"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "Apollo AIR-1 (MQTT firmware, CO2 add-on installed)"
  name_add_mac_suffix: true
  project:
    name: "custom.apollo-air-1-mqtt"
    version: "${version}"
  min_version: 2025.2.0
  on_boot:
    priority: 500
    then:
      - text_sensor.template.publish:
          id: apollo_firmware_version
          state: "${version}"
      - lambda: |-
          id(deep_sleep_1).set_sleep_duration(id(deep_sleep_sleep_duration).state * 60 * 1000);
      - if:
          condition:
            switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing deep sleep: prevent_sleep switch is on");
                id(deep_sleep_1).prevent_deep_sleep();
  on_shutdown:
    - light.turn_off: rgb_light

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

# Firmware downloads for the pull-OTA path below. The 4.5s default timeout is far
# too short for a ~1.1MB image, and the download must not trip the watchdog.
# verify_ssl uses esp-idf's built-in Mozilla root CA bundle, so https:// to a
# Let's Encrypt host validates with no cert config of your own. Plain http:// URLs
# work too, and redirects are followed.
http_request:
  verify_ssl: true
  timeout: 60s
  buffer_size_rx: 2048
  watchdog_timeout: 120s

ota:
  # Push OTA — kept as the bench/recovery path (`esphome run`), needs the address.
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
  # Pull OTA — driven by the ${mqtt_topic}/command/ota trigger in the mqtt block.
  - platform: http_request
    id: ota_http

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Apollo AIR1 Hotspot"

captive_portal:

web_server:
  port: 80
  version: 3

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: ${mqtt_port}
  username: !secret mqtt_username
  password: !secret mqtt_password
  # TLS. The CA that signed your broker's certificate, as a PEM block in
  # secrets.yaml (see the example file for how to obtain it). ESPHome's mqtt
  # component needs an explicit CA -- unlike http_request above, it cannot use
  # esp-idf's bundled root store. For a PLAINTEXT broker, comment this line out
  # and set the mqtt_port substitution to 1883.
  certificate_authority: !secret mqtt_ca_cert
  topic_prefix: ${mqtt_topic}
  discovery: false
  # Pull-OTA trigger. Publish (NOT retained -- see below):
  #   {"command":"ota","url":"https://host/path/firmware.ota.bin","version":"1.2.0"}
  # to ${mqtt_topic}/command/ota. The device fetches the image itself, so the
  # publisher never needs the device's IP or hostname -- only the broker.
  #
  # NEVER publish this retained: the broker would replay it on every reconnect,
  # and the device reconnects immediately after an OTA reboot -- an endless
  # reflash loop. The version guard below is the backstop if that ever happens
  # by accident, and also makes re-sending the same command a no-op.
  on_json_message:
    - topic: ${mqtt_topic}/command/ota
      qos: 1
      then:
        - if:
            condition:
              lambda: |-
                std::string url(x["url"] | "");
                std::string ver(x["version"] | "");
                if (url.empty()) {
                  ESP_LOGE("ota", "OTA command has no 'url' field - ignoring");
                  return false;
                }
                if (ver == "${version}") {
                  ESP_LOGI("ota", "OTA command for %s, already running it - skipping", ver.c_str());
                  return false;
                }
                ESP_LOGW("ota", "OTA command: %s -> %s (running ${version})", ver.c_str(), url.c_str());
                return true;
            then:
              - ota.http_request.flash:
                  url: !lambda 'return std::string(x["url"] | "");'
                  md5_url: !lambda 'return std::string(x["url"] | "") + ".md5";'
  on_connect:
    - delay: 20s
    - lambda: |-
        id(reportAllValues).execute();
    - delay: 3s
    - if:
        condition:
          switch.is_off: prevent_sleep
        then:
          - deep_sleep.enter:
              id: deep_sleep_1

globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  - id: runTest
    restore_value: yes
    type: bool
    initial_value: "true"
  - id: testCycleCount
    type: int
    restore_value: no
    initial_value: "0"
  - id: dps310Passed
    restore_value: no
    type: bool
    initial_value: "false"
  # Latches whether the air-danger alarm is currently showing, so airDangerCheck
  # only acts on transitions. Without it, every evaluation would re-issue
  # turn_on and restart the strobe from its first color -- and since the check
  # now runs on every sensor reading rather than once per publish, the alarm
  # would stutter several times a minute rather than once. Not restored:
  # the alarm state should be re-derived from live readings on boot, never
  # replayed from flash.
  - id: air_danger_active
    restore_value: no
    type: bool
    initial_value: "false"
  # Last steady-colour state actually pushed to the LED, so update_air_quality_led
  # can skip a redundant repaint. It now runs on every air-quality reading
  # (~4 sensors x 10s) and LightCall::perform() publishes the light's MQTT state
  # topic on every call whether or not anything changed -- without this the
  # broker would carry ~24 identical rgb_light/state messages a minute.
  # -2 is the "unknown, repaint unconditionally" sentinel; -1 means "off".
  - id: led_last_band
    restore_value: no
    type: int
    initial_value: "-2"
  - id: led_last_level
    restore_value: no
    type: float
    initial_value: "-1.0f"

i2c:
  sda: GPIO1
  scl: GPIO0
  id: bus_a

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 5min
  run_duration: 2min

# Continuous (USB) mode: while prevent_sleep is on, re-publish the combined
# /state snapshot every 60s so your consumer keeps getting data. The
# switch.is_on check is only read here as a "running continuously?" flag --
# it does NOT re-prevent sleep (that latches once when the switch turns on).
# In battery/duty-cycle mode (prevent_sleep off) this stays quiet and the
# on_connect publish + deep sleep handles the one-point-per-wake cadence.
interval:
  - interval: 60s
    then:
      - if:
          condition:
            switch.is_on: prevent_sleep
          then:
            - script.execute: reportAllValues

# Stock air-quality LED. Upstream Core.yaml drives rgb_light from ONE selected
# metric, banded into six severity colors. "All" is a local addition and the
# default: it takes the worst band across every air-quality channel the device
# has, so a spike on any one of them colours the LED. The single-metric options
# are kept because pinning the LED to one channel is genuinely useful when you
# are calibrating or debugging that channel.
#
# This is independent of the Air Danger strobe: the strobe overrides the steady
# color while the air is genuinely unsafe, and the color is restored when it
# clears. See update_air_quality_led.
select:
  - platform: template
    name: "Air Quality LED Source"
    id: air_quality_led_source
    icon: mdi:led-on
    optimistic: true
    restore_value: true
    entity_category: "config"
    # WARNING: restore_value persists the option's INDEX, not its name (see
    # template_select.cpp setup_with_restore). Inserting or reordering an option
    # therefore silently reassigns what every already-deployed unit restores to.
    # Adding "All" at index 1 shifted this list by one, so a device last set to
    # "NowCast AQI" (old index 1) came back as "All", and one set to "CO2" (old
    # index 2) came back as "NowCast AQI". Append new options at the END unless
    # you intend that remap, and check the unit after an OTA either way.
    # "NowCast AQI" was renamed to "PM AQI" IN PLACE, keeping index 2, so that
    # rename is safe for deployed units -- unlike the insertion above.
    options: ["Off", "All", "PM AQI", "CO2", "VOC Index", "NOx Index"]
    # Only applies to a factory-reset or newly flashed device; a deployed unit
    # restores its stored index instead.
    initial_option: "All"
    on_value:
      then:
        - script.execute: update_air_quality_led

number:
  - platform: template
    name: "LED Brightness"
    id: air_quality_led_brightness
    icon: mdi:brightness-6
    optimistic: true
    restore_value: true
    entity_category: "config"
    unit_of_measurement: "%"
    # Upstream's floor is 5; 0 is allowed here so the slider doubles as the
    # master off. There is deliberately no separate enable switch -- one
    # control that can reach zero beats two that can disagree.
    #
    # STEADY MODE ONLY. This slider has no effect while LED Alarm Mode is on --
    # not even at 0. An alarm that a stray slider drag can dim to invisibility
    # is not an alarm, so the strobe is hardcoded to 100% and ignores this
    # control entirely. ESPHome template numbers cannot be greyed out at
    # runtime, so the slider stays movable in alarm mode; it just does nothing
    # until you switch back to indicator mode.
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    mode: slider
    on_value:
      then:
        - script.execute: apply_led_state
  - platform: template
    name: "SEN55 Temperature Offset"
    id: sen55_temperature_offset
    restore_value: true
    initial_value: 6.0
    min_value: -70.0
    max_value: 70.0
    entity_category: "CONFIG"
    unit_of_measurement: "°C"
    optimistic: true
    update_interval: never
    step: 0.1
    mode: box
  - platform: template
    name: "SEN55 Humidity Offset"
    id: sen55_humidity_offset
    restore_value: true
    initial_value: 0
    min_value: -70.0
    max_value: 70.0
    entity_category: "CONFIG"
    unit_of_measurement: "%"
    optimistic: true
    update_interval: never
    step: 0.1
    mode: box
  - platform: template
    name: "DPS310 Pressure Offset"
    id: dps310_pressure_offset
    disabled_by_default: true
    restore_value: true
    initial_value: 0.0
    min_value: -100.0
    max_value: 100.0
    entity_category: "CONFIG"
    unit_of_measurement: "hPa"
    optimistic: true
    update_interval: never
    step: 0.1
    mode: box
  - platform: template
    name: "Sleep Duration"
    id: deep_sleep_sleep_duration
    min_value: 0
    max_value: 800
    step: 1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 5
    icon: "mdi:arrow-collapse-right"
    entity_category: CONFIG
    unit_of_measurement: "min"
    on_value:
      then:
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(x * 60 * 1000);

binary_sensor:
  - platform: status
    name: "Device Online"
    id: device_online
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    id: reset_button
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();
    on_release:
      then:
        - lambda: |-
            if (millis() - id(button_press_timestamp) >= 10000) {
              id(prevent_sleep).turn_on();
              id(factory_reset_switch).turn_on();
            }
            else if (millis() - id(button_press_timestamp) >= 3000) {
              // Hold 3s: keep device awake (e.g. for OTA)
              id(prevent_sleep).turn_on();
              id(deep_sleep_1).prevent_deep_sleep();
            }
            else {
              id(statusCheck).execute();
              delay(3000);
              id(testCycleCount) = 0;
              id(runTest) = true;
              id(testScript).execute();
            }

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature

  - platform: uptime
    name: "Uptime"
    id: sys_uptime
    update_interval: 60s

  - platform: wifi_signal
    name: "RSSI"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: scd4x
    id: scd40
    co2:
      name: "CO2"
      id: "co2"
      # Unconditional: with the "All" source any channel can own the colour, so
      # the script re-derives the whole LED state rather than each sensor
      # guessing whether it is the selected one. led_evaluate also re-checks the
      # danger alarm, which is what makes the LED react within a sample instead
      # of waiting for the 60s reportAllValues tick.
      on_value:
        - script.execute: led_evaluate
    # OFF deliberately, and unlike upstream there is no runtime switch for it.
    # ASC re-baselines by treating the lowest CO2 seen over a multi-day window
    # as fresh outdoor air (~400ppm). That assumption holds for a sensor that
    # gets aired out and is actively wrong for one that lives indoors
    # permanently: an occupied room rarely bottoms out at 400ppm, so ASC would
    # walk the baseline down and under-report. Use the
    # `Calibrate SCD40 To 420ppm` button outdoors instead (see the README).
    # Upstream's toggle needs a script of raw I2C commands -- the SCD40 only
    # accepts the setting while idle and forgets it on power loss -- which is
    # not worth carrying for a setting that should stay off here.
    automatic_self_calibration: false
    # 10s to match the SEN55, so the LED tracks a CO2 change at roughly the rate
    # a person notices one. The SCD40 in periodic mode produces a fresh sample
    # every ~5s internally, so this reads real measurements rather than repeats
    # of a cached one.
    #
    # This does NOT speed up data logging. Node-RED -> InfluxDB consumes the
    # combined ${mqtt_topic}/state snapshot, which reportAllValues publishes on
    # its own 60s interval and which force-updates every component first. The
    # only cost here is that this sensor's individual state topic now publishes
    # 6x more often -- a few bytes a second, retained, not written to Influx.
    update_interval: 10s
    measurement_mode: "periodic"
    i2c_id: bus_a
    ambient_pressure_compensation_source: dps310pressure

  - platform: dps310
    id: dps_310
    pressure:
      name: "DPS310 Pressure"
      id: dps310pressure
      filters:
        - lambda: |-
            float offset = id(dps310_pressure_offset).state;
            return isnan(offset) ? x : x + offset;
    temperature:
      id: dps310temperature
    update_interval: 30s
    i2c_id: bus_a

  - platform: sen5x
    id: sen55
    pm_1_0:
      name: "PM <1µm Weight concentration"
      id: pm_1_0
      accuracy_decimals: 1
    pm_2_5:
      name: "PM <2.5µm Weight concentration"
      id: pm_2_5
      accuracy_decimals: 1
    pm_4_0:
      name: "PM <4µm Weight concentration"
      id: pm_4_0
      accuracy_decimals: 1
    pm_10_0:
      name: "PM <10µm Weight concentration"
      id: pm_10_0
      accuracy_decimals: 1
    temperature:
      name: "SEN55 Temperature"
      id: sen55_temperature
      filters:
        - lambda: return x - id(sen55_temperature_offset).state;
      accuracy_decimals: 1
    humidity:
      name: "SEN55 Humidity"
      id: sen55_humidity
      filters:
        - lambda: return x - id(sen55_humidity_offset).state;
      accuracy_decimals: 1
    voc:
      name: "SEN55 VOC"
      id: sen55_voc
      on_value:
        - script.execute: led_evaluate
      algorithm_tuning:
        # https://sensirion.com/media/documents/25AB572C/62B463AA/Sensirion_Engineering_Guidelines_SEN5x.pdf
        index_offset: 100
        learning_time_offset_hours: 72
        learning_time_gain_hours: 72
        gating_max_duration_minutes: 180
        std_initial: 50
        gain_factor: 230
    nox:
      name: "SEN55 NOX"
      id: sen55_nox
      on_value:
        - script.execute: led_evaluate
    acceleration_mode: low
    store_baseline: true
    # Some units misreport SEN54 on the product name register even though the
    # NOx element is present; forcing the model keeps NOx enabled. Needs the
    # model option from esphome 2026.7.2. (This unit is worse than a SEN54
    # misreport -- it answers the device-info read with all zeros, logging
    # "Type: UNKNOWN / Product ID: 0", so auto-detection can never enable NOx.)
    model: sen55
    address: 0x69
    update_interval: 10s

  - platform: template
    name: "PM 0.3 To 1 µm"
    id: pm0_3_to_1
    disabled_by_default: true
    lambda: return id(pm_1_0).state;
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  - platform: template
    name: "PM 1 To 2.5 µm"
    id: pm1_to_2_5
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_2_5).state - id(pm_1_0).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  - platform: template
    name: "PM 2.5 To 4 µm"
    id: pm2_5_to_4
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_4_0).state - id(pm_2_5).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  - platform: template
    name: "PM 4 To 10 µm"
    id: pm4_to_10
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_10_0).state - id(pm_4_0).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  # Named "PM AQI", not "NowCast AQI" as upstream has it. This component takes
  # the CURRENT pm_2_5/pm_10_0 values, runs each through the EPA breakpoint
  # table with linear interpolation, and publishes the max -- see
  # aqi_calculator.h. It keeps no history at all.
  #
  # NowCast is a different algorithm entirely: a weighted average over the
  # previous 12 HOURS of PM, with the weight derived from the min/max ratio in
  # that window. EPA built it so AirNow could report something comparable to the
  # 24h-averaged AQI in near-real-time while damping spikes. This component
  # structurally cannot be that -- there is no buffer to average over.
  #
  # "PM" also earns its place: a real EPA AQI is the max across PM2.5, PM10,
  # ozone, NO2, SO2 and CO. This device measures only the two particulate
  # channels, so on a bad ozone day the true outdoor AQI is higher than this
  # number and nothing here would know. (The breakpoints themselves are current
  # -- the first PM2.5 boundary is 9.1, the 2024 revised NAAQS, not the old
  # 12.1.)
  - platform: aqi
    name: "PM AQI"
    id: pm_aqi
    pm_2_5: pm_2_5
    pm_10_0: pm_10_0
    calculation_type: AQI
    device_class: aqi
    on_value:
      - script.execute: led_evaluate

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Light"
    pin: GPIO3
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 3
    rgb_order: grb
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
      # Air danger alarm. Cycles saturated colors with dark gaps between them --
      # the changing hue plus the blink is what makes it read as an alarm from
      # the corner of your eye rather than as ordinary status lighting (the
      # boot statusCheck already uses steady blue/green/yellow). Driven by the
      # airDangerCheck script, not selectable as a mood effect.
      - strobe:
          name: "Air Danger"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 150ms
            - state: false
              duration: 60ms
            - state: true
              brightness: 100%
              red: 100%
              green: 100%
              blue: 100%
              duration: 150ms
            - state: false
              duration: 60ms
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 150ms
            - state: false
              duration: 60ms
            - state: true
              brightness: 100%
              red: 100%
              green: 60%
              blue: 0%
              duration: 150ms
            - state: false
              duration: 60ms
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 100%
              duration: 150ms
            - state: false
              duration: 60ms

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"

  - platform: factory_reset
    disabled_by_default: true
    name: "Factory Reset ESP"
    id: factory_reset_all

  - platform: template
    name: "Calibrate SCD40 To 420ppm"
    id: set_SCD40_calibrate
    on_press:
      - scd4x.perform_forced_calibration:
          value: 420
          id: scd40

  - platform: template
    name: "Clean SEN55"
    id: clean_sen55
    on_press:
      - sen5x.start_fan_autoclean: sen55

text_sensor:
  # Convert VOC Index To Text:
  # https://sensirion.com/media/documents/02232963/6294E043/Info_Note_VOC_Index.pdf
  - platform: template
    name: "VOC Quality"
    id: voc_quality
    icon: mdi:air-filter
    lambda: |-
      if (id(sen55_voc).state < 80) {
        return std::string("Improved");}
      else if (id(sen55_voc).state < 150) {
        return std::string("Normal");}
      else if (id(sen55_voc).state < 250) {
        return std::string("Abnormal");}
      else if (id(sen55_voc).state < 400) {
        return std::string("Very abnormal");}
      else if (id(sen55_voc).state >= 400) {
        return std::string("Extremely abnormal");}
      else {
        return std::string("Unknown");}

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      entity_category: "diagnostic"
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: "diagnostic"
  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

switch:
  # Which of the two behaviours the LED runs. ON  = alarm only: dark until a
  # reading crosses a danger threshold, then the strobe, always at 100% with the
  # LED Brightness slider inert. OFF = steady air-quality colour from Air
  # Quality LED Source at the slider's brightness, and no strobe. They are
  # deliberately exclusive -- running both means the steady colour is really
  # just "the alarm is not firing", which is not worth an LED.
  - platform: template
    name: "LED Alarm Mode"
    id: led_alarm_mode
    icon: mdi:alarm-light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    on_turn_on:
      - script.execute: apply_led_state
    on_turn_off:
      - script.execute: apply_led_state

  - platform: factory_reset
    id: factory_reset_switch
    internal: true

  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    # ALWAYS_ON, not RESTORE_DEFAULT_ON: this unit is permanently USB-powered,
    # so continuous mode is the only mode that should survive a reboot.
    # RESTORE_DEFAULT_ON persists an OFF, and three things can set one (the
    # dashboard's Setup card, the device web UI, a direct MQTT publish), so a
    # stray toggle would silently duty-cycle the device forever: data drops
    # from 1/min to ~1/5min, the air-danger LED is dark for most of each cycle,
    # and -- worst -- the SEN55 VOC/NOx gas index algorithms lose the
    # continuous runtime they need to hold their learned baselines. Forcing it
    # on at boot means a power cycle always recovers. Still toggleable at
    # runtime if you ever do want the battery duty cycle; it just won't stick.
    restore_mode: ALWAYS_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - lambda: |-
            id(deep_sleep_1).allow_deep_sleep();

script:
  - id: testScript
    then:
      if:
        condition:
          - lambda: "return id(runTest) == true;"
        then:
          - lambda: "id(runTest) = false;"
          - lambda: "id(testCycleCount) = 0;"
          - while:
              condition:
                - lambda: "return id(testCycleCount) < 5;"
              then:
                - if:
                    condition:
                      - lambda: "return id(dps310Passed) == false;"
                    then:
                      - if:
                          condition:
                            - lambda: "return id(dps310pressure).state > 800 && id(dps310pressure).state < 1200;"
                          then:
                            - lambda: "id(dps310Passed) = true;"
                - if:
                    condition:
                      - lambda: "return id(dps310Passed);"
                    then:
                      - lambda: "id(testCycleCount) = 10;"
                - lambda: "id(runTest) = false;"
                - delay: 1s
                - lambda: "id(testCycleCount) += 1;"
          - if:
              condition:
                - lambda: "return id(dps310Passed);"
              then:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 100%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light
              else:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 100%
                    green: 0%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light

  # Strobes the RGB LED through colors while any reading is at a level that is
  # actually harmful to breathe, and clears it once everything is back under.
  # Thresholds and their justification live in the substitutions at the top.
  #
  # Driven by led_evaluate off every air-quality sensor's on_value, so on USB
  # power it re-evaluates roughly every 10s. Also runs at the end of
  # reportAllValues, which guarantees the LED and the published snapshot can
  # never disagree about the same cycle, and which is the only evaluation that
  # happens in battery/deep-sleep mode -- one per wake, with the LED necessarily
  # dark while asleep. This is a mains-powered feature in practice.
  - id: airDangerCheck
    mode: single
    then:
      - lambda: |-
          // Do NOT name these after entity ids -- id(co2) generates `co2->state`,
          // so a local called `co2` shadows the entity pointer and fails to
          // compile with "base operand of '->' is not a pointer".
          // Mode gates the alarm, and nothing else does. The brightness slider
          // is deliberately NOT consulted here -- see the number's comment: an
          // alarm you can accidentally dim to nothing is not an alarm, so in
          // alarm mode the slider is inert and the strobe always runs at 100%.
          // If the alarm was firing when the mode changed, drop it and hand the
          // LED back to the steady colour, which turns itself off when the
          // slider is at 0 or the source is "Off".
          if (!id(led_alarm_mode).state) {
            if (id(air_danger_active)) {
              id(air_danger_active) = false;
              id(rgb_light).turn_off().perform();
              id(restore_air_quality_led).execute();
            }
            return;
          }

          const float co2_ppm = id(co2).state;
          const float aqi_val = id(pm_aqi).state;
          const float voc_val = id(sen55_voc).state;
          // NaN-guarded: a sensor that has not produced a reading yet (SCD40
          // needs a warm-up, and NOx/VOC start as NaN after a baseline reset)
          // must never be treated as a danger. Comparing NaN yields false
          // anyway, but being explicit keeps it obvious that a dead sensor
          // fails SAFE-looking -- see the caveat in the README.
          //
          // A threshold of 0 switches that channel off. The substitution is
          // textual, so the guard folds to `0 > 0` at compile time and the rest
          // of the clause is discarded -- a disabled channel is free, and the
          // reading is still taken and published regardless. VOC is off by
          // default here; see the substitutions at the top for why.
          const bool danger =
              (${danger_co2_ppm} > 0 && !isnan(co2_ppm) && co2_ppm >= ${danger_co2_ppm}) ||
              (${danger_aqi} > 0 && !isnan(aqi_val) && aqi_val >= ${danger_aqi}) ||
              (${danger_voc_index} > 0 && !isnan(voc_val) && voc_val >= ${danger_voc_index});

          if (danger == id(air_danger_active)) {
            return;  // no transition, leave the strobe running or the LED off
          }
          id(air_danger_active) = danger;

          if (danger) {
            ESP_LOGW("Apollo", "AIR DANGER: co2=%.0fppm aqi=%.0f voc=%.0f -- alarm ON", co2_ppm, aqi_val, voc_val);
            // A steady-mode attention blink may be mid-flight; it modulates
            // brightness and would fight the strobe for control of the light.
            id(led_pulse).stop();
            auto call = id(rgb_light).turn_on();
            // Hardcoded full brightness. The strobe's own colours are defined
            // at 100% and the master brightness would scale them, so this has
            // to be set explicitly -- otherwise the light would inherit
            // whatever the steady colour last left here.
            call.set_brightness(1.0f);
            call.set_effect("Air Danger");
            call.perform();
          } else {
            ESP_LOGI("Apollo", "Air back within safe limits -- alarm OFF");
            auto call = id(rgb_light).turn_off();
            call.perform();
            // Hand the LED back to the steady air-quality colour. That script
            // turns it off by itself when the source is "Off", so this stays
            // dark for anyone who has not enabled the feature.
            id(restore_air_quality_led).execute();
          }

  # Stock behaviour, ported from upstream Core.yaml. Paints rgb_light with the
  # severity band of whichever metric air_quality_led_source names.
  - id: update_air_quality_led
    then:
      - lambda: |-
          // The select's restore_value publishes during component setup and
          // fires on_value before rgb_light (esp32_rmt_led_strip) is
          // initialised; touching the light then faults in schedule_show().
          if (millis() < 5000) {
            return;
          }

          // statusCheck (boot/button status flash) and testScript own the LED
          // while they run; don't repaint underneath them.
          if (id(statusCheck).is_running() || id(testScript).is_running()) {
            return;
          }

          // Local addition, not in upstream: this firmware also has the Air
          // Danger strobe, which must outrank a steady status colour. While the
          // alarm is up, leave it alone -- airDangerCheck calls this script
          // again once the air clears, which repaints the correct band.
          if (id(air_danger_active)) {
            return;
          }

          // Everything below computes a DESIRED state -- band (-1 = LED off)
          // plus a brightness -- and applies it exactly once at the bottom,
          // through the dedup guard. Nothing here may touch rgb_light directly.
          int band = -1;
          float level = id(air_quality_led_brightness).state / 100.0f;

          const std::string src = id(air_quality_led_source).current_option();

          // Map a metric to a severity band: 0=Good ... 5=Hazardous, or -1 for
          // "no usable reading". Each metric has its own scale, but they all
          // land on the same 0-5 band and share one colour table below -- which
          // is what makes the worst-of comparison in "All" meaningful.
          auto band_aqi = [](float x) -> int {       // US EPA AQI
            if (isnan(x)) return -1;
            if (x <= 50)   return 0;
            if (x <= 100)  return 1;
            if (x <= 150)  return 2;
            if (x <= 200)  return 3;
            if (x <= 300)  return 4;
            return 5;
          };
          // ppm, SCD40. Retuned away from upstream's 800/1000/1500/2000/2500,
          // which paired its top band with the name "Hazardous" at 2500ppm --
          // an ordinary closed bedroom overnight.
          //
          // There is NO official government severity scale for indoor CO2. EPA
          // does not regulate it (not a criteria pollutant), and the WHO indoor
          // air quality guidelines do not cover it. Only two ends are anchored:
          //
          //   800   CDC ventilation guidance for shared indoor spaces. A
          //         ventilation-adequacy proxy, NOT a health threshold.
          //   1100  ASHRAE comfort/odour range (~700ppm above outdoor ambient).
          //         Also a professional-society figure, not a regulation.
          //   5000  OSHA PEL (29 CFR 1910.1000) and NIOSH REL, 8h TWA. The one
          //         enforceable number in the whole scale.
          //
          // 2000 and 3500 are interpolation between those, and are labelled in
          // the README as judgement calls rather than guidance. The top band
          // now coincides with the danger_co2_ppm strobe threshold instead of
          // sitting at half of it, so "worst steady colour" means "you are at
          // the level that trips the alarm" rather than contradicting it.
          //
          // Caveat that no threshold can fix: the PEL is an 8h occupational
          // limit for healthy adult workers. This unit is in a bedroom.
          auto band_co2 = [](float x) -> int {
            if (isnan(x)) return -1;
            if (x <= 800)  return 0;   // well ventilated
            if (x <= 1100) return 1;   // acceptable
            if (x <= 2000) return 2;   // stuffy
            if (x <= 3500) return 3;   // poorly ventilated
            if (x <= 5000) return 4;   // very poor
            return 5;                  // occupational limit exceeded
          };
          // The two Sensirion gas indices run 1-500 and are RELATIVE to a
          // learned baseline, so they answer "different from recent normal?"
          // rather than "harmful?". Their top rung is "extremely abnormal",
          // which is not a severity claim at all -- so both cap at band 4 and
          // neither can ever drive the LED to band 5 on its own.
          // VOC is centred on index_offset 100 (set in algorithm_tuning above);
          // NOx uses the driver's default offset of 1, which is why its first
          // boundary is so much lower rather than a copy-paste slip.
          auto band_voc = [](float x) -> int {
            if (isnan(x)) return -1;
            if (x < 80)   return 0;
            if (x < 150)  return 1;
            if (x < 250)  return 2;
            if (x < 400)  return 3;
            return 4;
          };
          auto band_nox = [](float x) -> int {
            if (isnan(x)) return -1;
            if (x < 20)   return 0;
            if (x < 150)  return 1;
            if (x < 250)  return 2;
            if (x < 400)  return 3;
            return 4;
          };

          // Master switch, and mode, folded into the head of the same chain so
          // there is exactly one place that decides the band. In alarm mode the
          // steady colour is not drawn at all -- the LED is dark unless the
          // strobe is running, which is what makes "dark" mean "nothing is
          // wrong" at a glance.
          if (level <= 0.0f || id(led_alarm_mode).state || src == "Off") {
            band = -1;
          } else if (src == "All") {
            // Worst-of across every air-quality channel the device has, so a
            // spike on any one of them shows up. A channel with no reading yet
            // returns -1 and simply does not vote: a warming-up SCD40 or a
            // post-reset VOC baseline can neither pin the colour at green nor
            // invent a red.
            band = std::max(std::max(band_aqi(id(pm_aqi).state), band_co2(id(co2).state)),
                            std::max(band_voc(id(sen55_voc).state), band_nox(id(sen55_nox).state)));
          } else if (src == "NowCast AQI") {
            band = band_aqi(id(pm_aqi).state);
          } else if (src == "CO2") {
            band = band_co2(id(co2).state);
          } else if (src == "VOC Index") {
            band = band_voc(id(sen55_voc).state);
          } else if (src == "NOx Index") {
            band = band_nox(id(sen55_nox).state);
          }
          // band is still -1 here if every selected channel read NaN: stay dark
          // rather than hold a stale colour that would look like a measurement.

          // Maroon - Hazardous, expressed as a DIMMED red rather than a dark red
          // channel value. Every LightCall runs normalize_color(), which
          // rescales RGB so the brightest channel is 1.0, so the obvious
          // set_rgb(0.5, 0, 0) is pushed straight back to pure red and would
          // render pixel-identical to band 3. Brightness is the only axis left
          // that survives normalisation. Applied here, before the dedup
          // comparison, so the cached level matches what was really sent.
          if (band == 5) {
            level *= 0.45f;
          }
          if (band < 0) {
            level = 0.0f;
          }

          // Dedup. Skip the repaint when the desired state is already on the
          // LED, so a steady-state device is silent on the broker. The is_on
          // cross-check catches anything that grabbed the light without going
          // through here (testScript's direct turn_off, a manual MQTT light
          // command), where the cache alone would wrongly say "no work to do".
          if (band == id(led_last_band) && fabsf(level - id(led_last_level)) < 0.001f &&
              id(rgb_light).remote_values.is_on() == (band >= 0)) {
            return;
          }
          // A WORSENING band change earns an attention pulse; everything else
          // just crossfades. A previous band below 0 is deliberately NOT a
          // worsening: the LED was off, or its state was unknown after a status
          // flash, and neither says anything about the air having got worse.
          const int prev = id(led_last_band);
          const bool worse = (prev >= 0 && band > prev);

          id(led_last_band) = band;
          id(led_last_level) = level;

          if (band < 0) {
            id(led_pulse).stop();
            id(rgb_light).turn_off().perform();
            return;
          }

          // Increasing severity, 0-5. Deliberately NOT named here: these were
          // upstream's EPA AQI category names (Good ... Hazardous), which are
          // legally defined terms for outdoor criteria pollutants and are only
          // correct for the AQI channel. Reusing them for CO2 -- which EPA does
          // not regulate at all -- borrowed authority that does not exist. The
          // band table in the README labels each channel in its own terms.
          auto call = id(rgb_light).turn_on();
          switch (band) {
            case 0: call.set_rgb(0.0f, 1.0f, 0.0f); break;   // Green
            case 1: call.set_rgb(1.0f, 1.0f, 0.0f); break;   // Yellow
            case 2: call.set_rgb(1.0f, 0.5f, 0.0f); break;   // Orange
            case 3: call.set_rgb(1.0f, 0.0f, 0.0f); break;   // Red
            case 4: call.set_rgb(0.6f, 0.0f, 1.0f); break;   // Purple
            case 5: call.set_rgb(1.0f, 0.0f, 0.0f); break;   // Red, dimmed above
          }
          call.set_brightness(level);
          // Every change eases across, worsening included -- led_pulse waits
          // out this fade before it swells, so the two read as one gesture
          // (fade to the new colour, swell once, settle) rather than fighting.
          call.set_transition_length(1000);
          call.perform();

          if (worse) {
            id(led_pulse).execute();
          } else {
            // An improvement while a pulse is mid-flight must cancel it --
            // otherwise the blink keeps dipping the brightness of a colour that
            // no longer means what the pulse was announcing.
            id(led_pulse).stop();
          }

  # Attention swell for a worsening band change, fired by update_air_quality_led
  # once it has painted the new colour. One smooth rise to full brightness and
  # back down to the steady level -- not a blink. Deliberately modulates ONLY
  # brightness: a LightCall changes just the fields it sets, so the colour
  # painted a moment earlier is preserved and this script never needs its own
  # copy of the band colour table.
  #
  # The opening delay waits out update_air_quality_led's 1s colour crossfade, so
  # the whole thing reads as one gesture: fade to the new colour, swell once,
  # settle. Starting the swell during the fade would just fight it.
  #
  # mode: restart so a second degradation part-way through (yellow -> orange ->
  # red in quick succession) restarts the gesture on the newer colour rather
  # than queueing a second one. update_air_quality_led calls stop() on it
  # whenever the air improves or the LED goes dark, and airDangerCheck stops it
  # before raising the strobe -- in all three cases a swell left running would
  # be modulating a colour that no longer means what it was announcing.
  #
  # NOTE: the swell needs headroom above the steady level to be visible. With
  # LED Brightness at 100% and a band below Hazardous, steady IS full brightness
  # and there is nothing to swell into.
  - id: led_pulse
    mode: restart
    then:
      - delay: 1s
      - light.turn_on:
          id: rgb_light
          brightness: 100%
          transition_length: 500ms
      - delay: 500ms
      - light.turn_on:
          id: rgb_light
          brightness: !lambda "return id(led_last_level);"
          transition_length: 800ms

  # Re-derives the whole LED state from the current readings: alarm first, then
  # the steady colour (which no-ops while the alarm owns the light). Hung off
  # every air-quality sensor's on_value, so both the strobe and the colour react
  # within one sample period instead of waiting for the 60s reportAllValues
  # tick. Cheap enough to run that often -- two lambdas, no delays, no I/O, and
  # both bail early when nothing has changed.
  #
  # mode: single is safe precisely because there are no delays here: both
  # callees are pure lambdas that run to completion synchronously, so this can
  # never still be running when the next sensor fires. (update_air_quality_led
  # may dispatch led_pulse, which does have delays -- but execute() only
  # schedules it, so this chain still returns immediately.)
  - id: led_evaluate
    mode: single
    then:
      - script.execute: airDangerCheck
      - script.execute: update_air_quality_led

  # Short delay so the caller's own light action lands first and
  # update_air_quality_led's is_running() guard passes. mode: restart so a
  # burst of callers collapses into one repaint.
  # Re-applies whatever the two LED switches now say. Clearing
  # air_danger_active first forces airDangerCheck past its "no transition"
  # early return, so flipping into alarm mode while the air is already bad
  # starts the strobe immediately instead of waiting for the next threshold
  # crossing. mode: restart so double-tapping a toggle settles once.
  - id: apply_led_state
    mode: restart
    then:
      - lambda: "id(air_danger_active) = false;"
      - script.execute: airDangerCheck
      - script.execute: restore_air_quality_led

  - id: restore_air_quality_led
    mode: restart
    then:
      # Invalidate the dedup cache. This script is the universal "something else
      # was driving the LED, hand it back" path -- boot/button statusCheck, the
      # danger strobe clearing, a mode change. In every case the light is
      # showing something the cache does not describe, and statusCheck in
      # particular can leave it ON in a colour that would otherwise compare
      # equal to the cached band and be skipped.
      - lambda: "id(led_last_band) = -2;"
      - delay: 200ms
      - script.execute: update_air_quality_led

  - id: statusCheck
    then:
      - if:
          condition:
            lambda: "return id(mqtt_client).is_connected();"
          then:
            - logger.log: "Apollo Automation: Connected to MQTT broker"
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected to WiFi, MQTT broker unreachable"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not connected to WiFi"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      # Upstream turns the LED off here; hand back to the air-quality
      # colour instead, which is a no-op when the source is "Off".
      - script.execute: restore_air_quality_led

  - id: reportAllValues
    then:
      - component.update: sen55
      - component.update: dps_310
      - component.update: scd40
      - component.update: wifi_signal_db
      - component.update: sys_esp_temperature
      - component.update: sys_uptime
      - component.update: pm0_3_to_1
      - component.update: pm1_to_2_5
      - component.update: pm2_5_to_4
      - component.update: pm4_to_10
      - component.update: voc_quality
      - delay: 500ms
      - mqtt.publish_json:
          topic: ${mqtt_topic}/state
          payload: |-
            root["co2_ppm"] = id(co2).state;
            root["pressure_hpa"] = id(dps310pressure).state;
            root["temperature_c"] = id(sen55_temperature).state;
            root["humidity_pct"] = id(sen55_humidity).state;
            root["pm1_0_ugm3"] = id(pm_1_0).state;
            root["pm2_5_ugm3"] = id(pm_2_5).state;
            root["pm4_0_ugm3"] = id(pm_4_0).state;
            root["pm10_0_ugm3"] = id(pm_10_0).state;
            root["voc_index"] = id(sen55_voc).state;
            root["nox_index"] = id(sen55_nox).state;
            root["voc_quality"] = id(voc_quality).state;
            root["aqi"] = id(pm_aqi).state;
            root["wifi_rssi_db"] = id(wifi_signal_db).state;
            root["esp_temperature_c"] = id(sys_esp_temperature).state;
            root["uptime_s"] = id(sys_uptime).state;
            root["firmware_version"] = "${version}";
      # Re-evaluate the air-danger alarm against the readings just published,
      # so the LED and the snapshot can never disagree about the same cycle.
      - script.execute: airDangerCheck
